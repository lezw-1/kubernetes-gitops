apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: connection-response-{{ .Values.global.environment }}
  namespace: {{ .Release.Namespace }}
spec:
  directResponse:
    contentType: text/plain
    body:
      inline: "Connection established!"
    statusCode: 200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: connection-{{ .Values.global.environment }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: cluster-gateway-{{ .Values.global.environment }}
      namespace: {{ .Release.Namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /connection
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: connection-response-{{ .Values.global.environment }}
