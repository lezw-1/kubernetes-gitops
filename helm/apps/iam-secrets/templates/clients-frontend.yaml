# Client Secret: frontend.
apiVersion: v1
kind: Secret
metadata:
  # Secret resource name.
  name: clients-frontend

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

# Opaque: arbitrary key/value data, not one of Kubernetes' typed secrets (e.g. tls, basic-auth).
type: Opaque

stringData:
  # Client definition, read from values.secrets.clients.frontend.
  # Secret.stringData requires string values, so booleans/lists are quoted
  # or JSON-encoded rather than emitted as native YAML types.
  clientId: {{ .Values.secrets.clients.frontend.clientId | quote }}
  enabled: {{ .Values.secrets.clients.frontend.enabled | quote }}
  publicClient: {{ .Values.secrets.clients.frontend.publicClient | quote }}
  directAccessGrantsEnabled: {{ .Values.secrets.clients.frontend.directAccessGrantsEnabled | quote }}
  roles: {{ .Values.secrets.clients.frontend.roles | toJson | quote }}
