# Client Secret: chronsorting.
apiVersion: v1
kind: Secret
metadata:
  # Secret resource name.
  name: clients-chronsorting

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

# Opaque: arbitrary key/value data, not one of Kubernetes' typed secrets (e.g. tls, basic-auth).
type: Opaque

stringData:
  # Client definition, read from values.secrets.clients.chronsorting.
  clientId: {{ .Values.secrets.clients.chronsorting.clientId }}
  enabled: {{ .Values.secrets.clients.chronsorting.enabled }}
  publicClient: {{ .Values.secrets.clients.chronsorting.publicClient }}
  directAccessGrantsEnabled: {{ .Values.secrets.clients.chronsorting.directAccessGrantsEnabled }}
  roles:
    {{- toYaml .Values.secrets.clients.chronsorting.roles | nindent 4 }}
