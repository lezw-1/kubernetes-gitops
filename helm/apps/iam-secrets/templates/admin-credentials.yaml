# Admin credentials Secret: admin-credentials.
apiVersion: v1
kind: Secret
metadata:
  # Secret resource name — must match helm/apps/iam/values.yaml: credentialsSecret.
  name: admin-credentials

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

# Opaque: arbitrary key/value data, not one of Kubernetes' typed secrets (e.g. tls, basic-auth).
type: Opaque

stringData:
  # Bootstrap admin username, read from values.secrets.admin.username.
  admin-username: {{ .Values.secrets.admin.username | quote }}

  # Bootstrap admin password, read from values.secrets.admin.password.
  admin-password: {{ .Values.secrets.admin.password | quote }}
