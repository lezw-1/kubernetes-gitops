# Realm Secret: ai-system.
apiVersion: v1
kind: Secret
metadata:
  # Secret resource name.
  name: realms-ai-system

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

# Opaque: arbitrary key/value data, not one of Kubernetes' typed secrets (e.g. tls, basic-auth).
type: Opaque

stringData:
  # Realm definition, read from values.secrets.realms.aiSystem.
  # Secret.stringData requires string values, so booleans/lists are quoted
  # or JSON-encoded rather than emitted as native YAML types.
  realm: {{ .Values.secrets.realms.aiSystem.realm | quote }}
  enabled: {{ .Values.secrets.realms.aiSystem.enabled | quote }}
  verifyEmail: {{ .Values.secrets.realms.aiSystem.verifyEmail | quote }}
  requiredActionsToDisable: {{ .Values.secrets.realms.aiSystem.requiredActionsToDisable | toJson | quote }}
