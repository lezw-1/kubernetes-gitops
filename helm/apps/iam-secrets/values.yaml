# Default values — overridden per environment via envs/<env>/iam-secrets.yaml.
# Split out of helm/apps/iam/values.yaml so only this chart needs rendering
# through the sops-helm plugin (see argocd/clusters/local/iam-dev.yaml);
# the main iam chart renders as plain Helm with no decryption involved.

# Secrets: realm, client, and user definitions materialized as Kubernetes
# Secrets by templates/secrets.yaml.
# Override per environment via envs/<env>/iam-secrets.yaml.
secrets:
  # Keycloak bootstrap admin credentials — materialized as the admin-credentials
  # Secret by templates/admin-credentials.yaml. Name must match
  # helm/apps/iam/values.yaml's credentialsSecret, which the iam Deployment
  # reads KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD from.
  admin:
    # Keycloak bootstrap admin username.
    # Default: empty — never commit a real value here. Supply it via a
    # SOPS-encrypted environment override at deploy time (see
    # argocd/clusters/local/values/iam-secrets.enc.yaml).
    username: ""

    # Keycloak bootstrap admin password.
    # Default: empty — same rule as username above; never commit a real password.
    password: ""

  # Realm definitions, keyed by a values-safe name (see templates/secrets.yaml: realms-* Secrets).
  realms:
    aiSystem:
      # Realm name.
      realm: ai-system

      # Whether the realm is enabled.
      enabled: true

      # Whether new users must verify their email.
      verifyEmail: false

      # Required actions disabled at realm creation.
      requiredActionsToDisable:
        - VERIFY_PROFILE

  # Client definitions, keyed by clientId (see templates/secrets.yaml: clients-* Secrets).
  clients:
    chronsorting:
      # Keycloak client ID.
      clientId: chronsorting

      # Whether the client is enabled.
      enabled: true

      # Whether the client can authenticate without a client secret.
      publicClient: false

      # Whether Resource Owner Password Credentials grant is allowed.
      directAccessGrantsEnabled: false

      # Client roles to create.
      roles:
        - viewer

    frontend:
      clientId: frontend
      enabled: true
      publicClient: true
      directAccessGrantsEnabled: true
      roles:
        - viewer

  # User definitions, keyed by a values-safe name (see templates/secrets.yaml: users-* Secrets).
  users:
    user1:
      # User email address.
      email: user1@ai-system.local

      # User first name.
      firstName: User

      # User last name.
      lastName: One

      # Whether the user is enabled.
      enabled: true

      # Whether the user's email is marked verified.
      emailVerified: true

      # Keycloak login username.
      # Default: empty — never commit a real value here. Supply it via a
      # SOPS-encrypted environment override at deploy time (see
      # argocd/clusters/local/values/iam-secrets.enc.yaml).
      username: ""

      # Keycloak login password.
      # Default: empty — same rule as username above; never commit a real password.
      password: ""

      # Client roles assigned to this user.
      roles:
        - client: chronsorting
          role: viewer
        - client: frontend
          role: viewer

    user2:
      email: user2@ai-system.local
      firstName: User
      lastName: Two
      enabled: true
      emailVerified: true

      # See user1's username/password comments above — never commit real values.
      username: ""
      password: ""

      roles: []
