apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment resource name.
  name: broker

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

spec:
  # Single replica — no clustering configured.
  replicas: 1

  # Recreate: avoids two Pods mounting the same ReadWriteOnce volume at once.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      # Must match template.metadata.labels below.
      app: broker

  template:
    metadata:
      labels:
        # Pod label, matched by the selector above and the Service.
        app: broker

      annotations:
        # Prevents node-drain/consolidation from evicting this single-replica
        # stateful Pod mid-write; a no-op on clusters without Karpenter.
        karpenter.sh/do-not-disrupt: "true"

    spec:
      containers:
        # Redis server container.
        - name: broker

          # Image repository:tag, sourced from values.image.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          # Image pull policy, sourced from values.image.pullPolicy.
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # Explicit port flag — keeps Redis's listen port in sync with values.service.port.
          command: ["redis-server"]
          args: ["--port", {{ .Values.service.port | quote }}]

          ports:
            # Container port Redis listens on, sourced from values.service.port.
            - containerPort: {{ .Values.service.port }}

          volumeMounts:
            # Redis's data directory, backed by the PVC below.
            - name: data
              mountPath: /data

          resources:
            requests:
              # Minimum CPU reserved for scheduling.
              cpu: {{ .Values.resources.requests.cpu }}

              # Minimum memory reserved for scheduling.
              memory: {{ .Values.resources.requests.memory }}

          # Readiness probe: pod removed from the Service until Redis responds.
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", {{ .Values.service.port | quote }}, "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        # Data volume, bound to the PVC created by templates/pvc.yaml.
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Namespace }}-broker-data
