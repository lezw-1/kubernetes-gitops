# Default values — overridden per environment via envs/<env>/iam.yaml.

# Global: shared across templates.
global:
  # Deployment environment name, used in hostnames and resource suffixes.
  # Allowed values: dev, staging, prod
  environment: dev

# Gateway: HTTPRoute hostname configuration.
gateway:
  hosts:
    # Full domain for the HTTPRoute hostname.
    # Default: empty disables hostname-based routing (route matches any host).
    domain: ""

# Image: container image settings.
image:
  # Container image repository.
  # Upgrade intentionally by changing the tag below — third-party image, not built by this repo's CI.
  repository: quay.io/keycloak/keycloak

  # Container image tag.
  tag: "26.5.5"

  # Allowed values: Always, IfNotPresent, Never
  pullPolicy: IfNotPresent

# Admin: bootstrap credentials for the Keycloak admin console.
admin:
  # Admin console username.
  # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
  username: ""

  # Admin console password.
  # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
  password: ""

# Subpath: URL prefix Keycloak is served under, behind the shared gateway.
subpath: "/iam"

# Service: ClusterIP configuration.
service:
  # Keycloak HTTP listen port.
  port: 8080

# TokenExpire: access token lifespan in seconds.
tokenExpire: 3600

# Debug: Keycloak log level.
# Allowed values: DEBUG, INFO, WARN, ERROR
debug: "INFO"

# Provision: post-install/upgrade job that seeds realms, clients, and users from config/.
provision:
  # Default: disabled — enable per-environment to run the seeding job.
  enabled: false

  user1:
    # Username for the seeded user1 account.
    # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
    username: ""

    # Password for the seeded user1 account.
    # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
    password: ""

  user2:
    # Username for the seeded user2 account.
    # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
    username: ""

    # Password for the seeded user2 account.
    # Store sensitive values securely (e.g., External Secrets, Sealed Secrets).
    password: ""

# HPA: horizontal pod autoscaler.
hpa:
  # Default: disabled — set true to enable autoscaling.
  enabled: false

  # Minimum pod count when HPA is enabled.
  minReplicas: 1

  # Maximum pod count when HPA is enabled.
  maxReplicas: 5

  # Target average CPU utilization percentage for scaling.
  targetCPUUtilization: 70
