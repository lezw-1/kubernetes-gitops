{{- if .Values.provision.enabled }}
# Post-install/upgrade Job that seeds realms, clients, and users into Keycloak from the config/ ConfigMaps.
apiVersion: batch/v1
kind: Job
metadata:
  # Job resource name.
  name: iam-provisioning

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

  annotations:
    # Run after every install/upgrade so config drift is corrected.
    "helm.sh/hook": post-install,post-upgrade

    # Replace any leftover Job from a previous run before creating the new one.
    "helm.sh/hook-delete-policy": before-hook-creation

spec:
  # Clean up the completed Job automatically after 5 minutes.
  ttlSecondsAfterFinished: 300

  # Retry up to 3 times before marking the Job failed.
  backoffLimit: 3

  template:
    spec:
      restartPolicy: Never

      # No Kubernetes API access needed — this Job only talks to the iam Service.
      automountServiceAccountToken: false

      volumes:
        # Realm ConfigMap, mounted for the bootstrap container to read.
        - name: iam-realms
          configMap:
            name: iam-realms-config

        # Client ConfigMap, mounted for the bootstrap container to read.
        - name: iam-clients
          configMap:
            name: iam-clients-config

        # User ConfigMap, mounted for the bootstrap container to read.
        - name: iam-users
          configMap:
            name: iam-users-config

      initContainers:
        # Blocks until the iam Service responds, so provisioning doesn't race the Deployment's startup.
        - name: wait-for-iam
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -x
              RETRIES=0; MAX_RETRIES=60
              until wget -qO- http://iam:{{ .Values.service.port }}{{ .Values.subpath }}/realms/master >/dev/null 2>&1; do
                RETRIES=$((RETRIES + 1))
                [ "$RETRIES" -ge "$MAX_RETRIES" ] && echo "Timeout waiting for IAM" && exit 1
                echo "Waiting for IAM..."
                sleep 5
              done
              echo "IAM is ready"

      containers:
        # Runs kcadm.sh against the iam Service to create realms, clients, roles, and users.
        - name: bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            # Admin username used to authenticate kcadm.sh, from credentialsSecret.
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: admin-username

            # Admin password used to authenticate kcadm.sh, from credentialsSecret.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: admin-password

            # Seeded user1 username, from credentialsSecret.
            - name: USER1_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: user1-username

            # Seeded user1 password, from credentialsSecret.
            - name: USER1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: user1-password

            # Seeded user2 username, from credentialsSecret.
            - name: USER2_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: user2-username

            # Seeded user2 password, from credentialsSecret.
            - name: USER2_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: user2-password

          volumeMounts:
            # Realm JSON files, read by the realm provisioning loop below.
            - name: iam-realms
              mountPath: /etc/iam/realms

            # Client JSON files, read by the client provisioning loop below.
            - name: iam-clients
              mountPath: /etc/iam/clients

            # User JSON files, read by the user provisioning loop below.
            - name: iam-users
              mountPath: /etc/iam/users

          command:
            - /bin/sh
            - -c
            - |
              set -e

              KCADM=/opt/keycloak/bin/kcadm.sh

              # jq unavailable in Keycloak image; parse with grep+sed
              json_str()  { grep "\"$2\"" "$1" | sed "s/.*\"$2\": *\"\([^\"]*\)\".*/\1/"; }
              json_bool() { grep "\"$2\"" "$1" | sed "s/.*\"$2\": *\(true\|false\).*/\1/"; }
              # Keycloak API requires internal UUID, not clientId/username
              kc_get_id() { $KCADM get "$1" -r "$2" -q "$3" --fields id --format csv --noquotes | head -n1; }

              # Authenticate against master realm to get admin token
              $KCADM config credentials \
                --server http://iam:{{ .Values.service.port }}{{ .Values.subpath }} \
                --realm master \
                --user "$ADMIN_USERNAME" \
                --password "$ADMIN_PASSWORD"
              echo "Authenticated as $ADMIN_USERNAME"

              # Provision realms
              for realm_file in /etc/iam/realms/*.json; do
                [ -f "$realm_file" ] || continue
                REALM=$(json_str  "$realm_file" realm)
                VERIFY=$(json_bool "$realm_file" verifyEmail)

                # Delete and recreate for idempotency on re-runs
                if $KCADM get realms/$REALM >/dev/null 2>&1; then
                  echo "Realm $REALM exists, recreating..."
                  $KCADM delete realms/$REALM
                fi
                $KCADM create realms -s realm="$REALM" -s enabled=true -s verifyEmail="$VERIFY"
                echo "Realm $REALM created"

                # Disable default actions that force password reset on first login
                ACTIONS=$(grep '"requiredActionsToDisable"' "$realm_file" | grep -o '"[A-Z_]*"' | tr -d '"')
                for action in $ACTIONS; do
                  $KCADM update authentication/required-actions/$action \
                    -r "$REALM" -s defaultAction=false -s enabled=false
                  echo "Required action $action disabled in $REALM"
                done
              done

              # Provision clients; REALM carries over from realm loop above
              for client_file in /etc/iam/clients/*.json; do
                [ -f "$client_file" ] || continue
                CLIENT_ID=$(json_str  "$client_file" clientId)
                PUBLIC=$(json_bool "$client_file" publicClient)
                DIRECT=$(json_bool "$client_file" directAccessGrantsEnabled)

                # Delete and recreate for idempotency on re-runs
                EXISTING_ID=$(kc_get_id clients "$REALM" "clientId=$CLIENT_ID")
                if [ -n "$EXISTING_ID" ]; then
                  echo "Client $CLIENT_ID exists, recreating..."
                  $KCADM delete clients/$EXISTING_ID -r "$REALM"
                fi
                $KCADM create clients -r "$REALM" \
                  -s clientId="$CLIENT_ID" -s enabled=true \
                  -s publicClient="$PUBLIC" -s directAccessGrantsEnabled="$DIRECT"

                # UUID needed for role operations on this client
                KC_CLIENT_ID=$(kc_get_id clients "$REALM" "clientId=$CLIENT_ID")
                [ -z "$KC_CLIENT_ID" ] && { echo "ERROR: client $CLIENT_ID not created" >&2; exit 1; }
                echo "Client $CLIENT_ID created: $KC_CLIENT_ID"

                ROLES=$(grep '"roles":' "$client_file" | sed 's/.*\[//;s/\].*//' | tr ',"' ' ' | tr -s ' ')
                for role in $ROLES; do
                  [ -z "$role" ] && continue
                  if $KCADM get clients/$KC_CLIENT_ID/roles/$role -r "$REALM" >/dev/null 2>&1; then
                    echo "Role $role exists on $CLIENT_ID, recreating..."
                    $KCADM delete clients/$KC_CLIENT_ID/roles/$role -r "$REALM"
                  fi
                  $KCADM create clients/$KC_CLIENT_ID/roles -r "$REALM" -s name="$role"
                  echo "Role $role created on $CLIENT_ID"
                done
              done

              # Provision users
              for user_file in /etc/iam/users/*.json; do
                [ -f "$user_file" ] || continue
                # Derive env var prefix from filename: user1.json -> USER1
                ENVPREFIX=$(basename "$user_file" .json | tr '[:lower:]' '[:upper:]')
                USERNAME=$(printenv "${ENVPREFIX}_USERNAME")
                PASSWORD=$(printenv "${ENVPREFIX}_PASSWORD")
                EMAIL=$(json_str    "$user_file" email)
                FIRSTNAME=$(json_str "$user_file" firstName)
                LASTNAME=$(json_str  "$user_file" lastName)

                # Delete and recreate for idempotency on re-runs
                EXISTING_ID=$(kc_get_id users "$REALM" "username=$USERNAME")
                if [ -n "$EXISTING_ID" ]; then
                  echo "User $USERNAME exists, recreating..."
                  $KCADM delete users/$EXISTING_ID -r "$REALM"
                fi
                $KCADM create users -r "$REALM" \
                  -s username="$USERNAME" -s enabled=true -s emailVerified=true \
                  -s email="$EMAIL" -s firstName="$FIRSTNAME" -s lastName="$LASTNAME"

                USER_ID=$(kc_get_id users "$REALM" "username=$USERNAME")
                [ -z "$USER_ID" ] && { echo "ERROR: $USERNAME not created" >&2; exit 1; }
                echo "$USERNAME created: $USER_ID"

                $KCADM set-password -r "$REALM" --userid "$USER_ID" --new-password "$PASSWORD"
                echo "Password set for $USERNAME"

                # Clear actions so user is not prompted on first login
                $KCADM update users/$USER_ID -r "$REALM" -s 'requiredActions=[]'
                echo "Required actions cleared for $USERNAME"

                ROLE_ENTRIES=$(grep '"client"' "$user_file" | sed 's/.*"client": *"\([^"]*\)".*"role": *"\([^"]*\)".*/\1:\2/')
                for entry in $ROLE_ENTRIES; do
                  ROLE_CLIENT=$(echo "$entry" | cut -d: -f1)
                  ROLE_NAME=$(echo "$entry" | cut -d: -f2)
                  $KCADM add-roles -r "$REALM" \
                    --uusername "$USERNAME" --cclientid "$ROLE_CLIENT" --rolename "$ROLE_NAME"
                  echo "Role $ROLE_NAME assigned to $USERNAME ($ROLE_CLIENT)"
                done
              done
{{- end }}
