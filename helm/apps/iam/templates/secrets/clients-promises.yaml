{{- if .Values.secretsProvisioning.enabled }}
# Client Secret: promises.
apiVersion: v1
kind: Secret
metadata:
  # Secret resource name.
  name: clients-promises

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

# Opaque: arbitrary key/value data, not one of Kubernetes' typed secrets (e.g. tls, basic-auth).
type: Opaque

stringData:
  # Client definition, read from values.secrets.clients.promises.
  # Secret.stringData requires string values, so booleans/lists are quoted
  # or JSON-encoded rather than emitted as native YAML types.
  clientId: {{ .Values.secrets.clients.promises.clientId | quote }}
  enabled: {{ .Values.secrets.clients.promises.enabled | quote }}
  publicClient: {{ .Values.secrets.clients.promises.publicClient | quote }}
  directAccessGrantsEnabled: {{ .Values.secrets.clients.promises.directAccessGrantsEnabled | quote }}
  roles: {{ .Values.secrets.clients.promises.roles | toJson | quote }}
{{- end }}
