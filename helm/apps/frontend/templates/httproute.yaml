apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.gateway.hosts.domain }}
  hostnames:
    - "{{ .Values.global.environment }}.{{ .Values.gateway.hosts.domain }}"
  {{- end }}
  parentRefs:
    # Must match the Gateway name in platform/networking/gateway, or the route silently never attaches
    - name: cluster-gateway-{{ .Values.global.environment }}
      namespace: networking
      {{- if .Values.gateway.hosts.domain }}
      sectionName: https
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: {{ .Values.service.port }}
