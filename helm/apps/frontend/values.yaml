# Default values — overridden per environment via envs/<env>/frontend.yaml.

# Global: shared across templates.
global:
  # Deployment environment name, used in hostnames and resource suffixes.
  # Allowed values: dev, staging, prod
  environment: dev

# Gateway: HTTPRoute hostname configuration.
gateway:
  hosts:
    # Full domain for the HTTPRoute hostname.
    # Default: empty disables hostname-based routing (route matches any host).
    domain: ""

# Image: container image settings (CI updates tag on each push).
image:
  # Container image repository.
  repository: ""

  # Container image tag.
  tag: ""

  # Allowed values: Always, IfNotPresent, Never
  pullPolicy: Always

# Service: ClusterIP configuration.
service:
  # nginx listen port.
  port: 80

# HPA: horizontal pod autoscaler.
hpa:
  # Default: disabled — set true to enable autoscaling.
  enabled: false

  # Minimum pod count when HPA is enabled.
  minReplicas: 1

  # Maximum pod count when HPA is enabled.
  maxReplicas: 5

  # Target average CPU utilization percentage for scaling.
  targetCPUUtilization: 70
