apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment resource name.
  name: assistant

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

spec:
  # Single replica — no HA for this app.
  replicas: 1

  # Recreate (not RollingUpdate) — the workspace PVC below is ReadWriteOnce,
  # so a second pod can't be scheduled to mount it during a rolling update.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      # Must match template.metadata.labels below.
      app: assistant

  template:
    metadata:
      labels:
        # Pod label, matched by the selector above.
        app: assistant

      annotations:
        # Forces a pod restart whenever configmap.yaml's rendered content
        # changes. The apply-config init container only runs once at pod
        # start, so without this, config-patch.json edits (e.g. the
        # channels.telegram.dmPolicy default) would silently stop applying
        # to already-running pods until someone manually ran a rollout
        # restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

    spec:
      # fsGroup 1000 — the image runs as uid/gid 1000 ("node"), but the
      # hostPath-backed workspace volume is created root-owned by default.
      # Without this, the app gets EACCES writing its state dir on startup.
      securityContext:
        fsGroup: 1000

      initContainers:
        # Fixes ownership of the hostPath-backed workspace volume, which is
        # created root-owned regardless of fsGroup above (hostPath doesn't
        # support Kubernetes' automatic fsGroup ownership management) — the
        # main container runs as uid/gid 1000 and needs write access to it.
        - name: fix-workspace-permissions
          image: busybox
          command:
            - sh
            - -c
            - chown -R 1000:1000 /home/node/.openclaw
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw

        # Declaratively applies templates/configmap.yaml's baseline config
        # (gateway.mode, default model) into openclaw.json on every pod
        # start — a recursive merge (via `openclaw config patch`), so it
        # doesn't clobber state written by a completed Telegram channel link.
        # Uses the app image itself since the `openclaw` CLI isn't available
        # in busybox.
        - name: apply-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - openclaw
            - config
            - patch
            - --file
            - /config/config-patch.json
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw

            - name: config
              mountPath: /config

        # Links the Telegram bot to this workspace on every pod start,
        # replacing the old manual `kubectl exec ... openclaw channels add`
        # step. Skipped when no token is set yet (e.g. before first deploy).
        # `channels add` isn't confirmed idempotent, so `|| true` stops a
        # re-run against an already-linked channel from crash-looping the
        # pod — if linking silently fails, `openclaw channels list` inside
        # the pod shows the real state.
        - name: link-telegram
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Telegram bot token, sourced from the assistant-secrets Secret (templates/secret.yaml).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: TELEGRAM_BOT_TOKEN
          command:
            - sh
            - -c
            - |
              if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
                openclaw channels add --channel telegram --token "$TELEGRAM_BOT_TOKEN" || true
              fi
          volumeMounts:
            - name: workspace
              mountPath: /home/node/.openclaw

      containers:
        # OpenClaw gateway — runs the agent loop and the Telegram channel.
        - name: assistant

          # Image repository:tag, sourced from values.image.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          # Image pull policy, sourced from values.image.pullPolicy.
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            # Forces OpenClaw's browser tool headless. Currently a no-op:
            # this deployment's only profile is the remote CDP one
            # (templates/configmap.yaml's browser.profiles.assistant-browser),
            # and OpenClaw docs confirm this setting only affects
            # locally-managed profiles it launches itself, not remote CDP
            # connections — Browserless's own container is what actually
            # runs headless. Declared here so it takes effect automatically
            # if a locally-managed profile is ever added alongside it.
            - name: OPENCLAW_BROWSER_HEADLESS
              value: "1"

            # Anthropic API key, sourced from the assistant-secrets Secret (templates/secret.yaml).
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: ANTHROPIC_API_KEY

            # GitHub PAT, sourced from the assistant-secrets Secret
            # (templates/secret.yaml). Consumed automatically at startup by
            # the github-copilot provider plugin, same as ANTHROPIC_API_KEY
            # above.
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: GITHUB_TOKEN

            # Telegram bot token, sourced from the assistant-secrets Secret
            # (templates/secret.yaml). Not consumed by the gateway process
            # itself — this copy exists only in case a channel needs
            # re-linking by hand (link-telegram init container above does it
            # automatically on every pod start).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: TELEGRAM_BOT_TOKEN

            # Freelancermap account email, sourced from the assistant-secrets
            # Secret (templates/secret.yaml).
            - name: FREELANCERMAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: FREELANCERMAP_EMAIL

            # Freelancermap account password, sourced from the
            # assistant-secrets Secret (templates/secret.yaml).
            - name: FREELANCERMAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assistant-secrets
                  key: FREELANCERMAP_PASSWORD

            # Freelancermap site URL, paired with FREELANCERMAP_EMAIL/
            # FREELANCERMAP_PASSWORD above for logging in on the assistant's
            # behalf. Not a secret — declared as a literal rather than
            # sourced from assistant-secrets.
            - name: FREELANCERMAP_URL
              value: "https://www.freelancermap.com"

            # CDP WebSocket URL of the headless browser service
            # (templates/browser-service.yaml), matching
            # config-patch.json's browser.profiles.assistant-browser.cdpUrl
            # (templates/configmap.yaml). Not consumed by OpenClaw itself —
            # written to the workspace .env below so anything else in the
            # workspace that needs to drive the browser directly over CDP
            # can read it from disk instead of hardcoding the service name.
            - name: CDP_URL
              value: "ws://assistant-browser:3000"

          volumeMounts:
            # Persistent workspace — holds the linked Telegram channel's
            # state plus conversation memory. The image
            # runs as a non-root "node" user (uid 1000) whose $HOME is
            # /home/node, not /root — confirmed by exec'ing into the image
            # (`id` / `echo $HOME`), since the docs describe the root-user
            # docker-compose path which doesn't apply here.
            - name: workspace
              mountPath: /home/node/.openclaw

          lifecycle:
            # Writes GITHUB_TOKEN and the Freelancermap credentials to a
            # dotenv file on the persistent workspace volume right after
            # this container starts, so they're readable there by anything
            # that expects a .env file on disk rather than process env.
            # Overwrites (not appends) on every container start so restarts
            # don't pile up duplicate lines on the PVC. Plaintext secrets at
            # rest on the volume — accepted tradeoff for having them
            # available as a file in the workspace.
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    cat > /home/node/.openclaw/workspace/.env <<EOF
                    GITHUB_TOKEN=$GITHUB_TOKEN
                    FREELANCERMAP_EMAIL=$FREELANCERMAP_EMAIL
                    FREELANCERMAP_PASSWORD=$FREELANCERMAP_PASSWORD
                    FREELANCERMAP_URL=$FREELANCERMAP_URL
                    CDP_URL=$CDP_URL
                    EOF

          resources:
            requests:
              # Minimum CPU reserved for scheduling.
              cpu: {{ .Values.resources.requests.cpu }}

              # Minimum memory reserved for scheduling.
              memory: {{ .Values.resources.requests.memory }}

            limits:
              # CPU hard cap — matches requests (Guaranteed QoS).
              cpu: {{ .Values.resources.limits.cpu }}

              # Memory hard cap — matches requests (Guaranteed QoS).
              memory: {{ .Values.resources.limits.memory }}

          # Placeholder exec probes — no confirmed HTTP health endpoint yet.
          # TODO: replace with the real health-check mechanism once the
          # OpenClaw image/version is chosen (see docs.openclaw.ai/gateway).
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f openclaw
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f openclaw
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5

      volumes:
        # Backs the workspace mount above with the PVC from templates/pvc.yaml.
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ .Release.Namespace }}-assistant-workspace

        # Backs the apply-config init container's mount with
        # templates/configmap.yaml's config-patch.json.
        - name: config
          configMap:
            name: assistant-config
