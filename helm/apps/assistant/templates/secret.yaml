apiVersion: v1
kind: Secret
metadata:
  # Secret resource name — read by the Deployment via secretKeyRef.
  name: assistant-secrets

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

type: Opaque
stringData:
  # Anthropic API key, sourced from values.secret.anthropicApiKey.
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}

  # Telegram bot token, sourced from values.secret.telegramBotToken.
  TELEGRAM_BOT_TOKEN: {{ .Values.secret.telegramBotToken | quote }}

  # GitHub PAT, sourced from values.secret.githubToken.
  GITHUB_TOKEN: {{ .Values.secret.githubToken | quote }}

  # Freelancermap account email, sourced from values.secret.freelancermapEmail.
  FREELANCERMAP_EMAIL: {{ .Values.secret.freelancermapEmail | quote }}

  # Freelancermap account password, sourced from values.secret.freelancermapPassword.
  FREELANCERMAP_PASSWORD: {{ .Values.secret.freelancermapPassword | quote }}
