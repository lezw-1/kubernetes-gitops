apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # Suffixed by env — dev/prod/local share one "networking" namespace
  name: cluster-gateway-{{ .Values.global.environment }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  {{- if .Values.gateway.nodePort.enabled }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: gateway-proxy-{{ .Values.global.environment }}
  {{- end }}
  listeners:
    # HTTP listener — redirects to HTTPS
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: team
                operator: In
                values:
                  - gateway-1
  {{- if .Values.gateway.tls.enabled }}
    # HTTPS listener — terminates TLS, routes to app namespace
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls-{{ .Values.global.environment }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              team: gateway-1  # namespaces must have this label for HTTPRoutes to attach to this gateway
  {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gateway-timeout-{{ .Values.global.environment }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway-{{ .Values.global.environment }}
  timeout:
    http:
      requestTimeout: {{ .Values.gateway.timeout.requestTimeout }}
