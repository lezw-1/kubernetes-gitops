# Static "Connection established!" health-check route at /connection on the shared gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  # HTTPRouteFilter resource name, referenced by the HTTPRoute's filters below.
  name: connection-response-{{ .Values.global.environment }}

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

spec:
  directResponse:
    # Static response body/type/status — no backend involved.
    contentType: text/plain
    body:
      inline: "Connection established!"
    statusCode: 200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # HTTPRoute resource name, suffixed by env.
  name: connection-{{ .Values.global.environment }}

  # Namespace set by the Argo CD Application's destination.
  namespace: {{ .Release.Namespace }}

spec:
  parentRefs:
    # Attaches to the shared cluster gateway.
    - name: cluster-gateway-{{ .Values.global.environment }}
      namespace: {{ .Release.Namespace }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /connection

      filters:
        # Short-circuits the request with the static response defined above.
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: connection-response-{{ .Values.global.environment }}
