# Helm chart API version.
apiVersion: v2

# Chart name.
name: gateway-controller

# Chart version — bump intentionally whenever templates or values change.
version: 0.1.0

# One-line description shown by `helm search`/`helm show chart`.
description: Envoy Gateway controller

# Upstream Envoy Gateway subchart, vendored into charts/.
dependencies:
  # Upstream chart name.
  - name: gateway-helm

    # Upgrade intentionally by changing this value.
    version: 1.8.0

    # OCI chart repository hosting the Envoy Gateway Helm chart.
    repository: oci://docker.io/envoyproxy
