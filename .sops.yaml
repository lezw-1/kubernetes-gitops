# SOPS encryption rules — which files get encrypted, and with which key.
creation_rules:
  # Any *.enc.yaml file under a cluster's values/ dir holds real secret
  # material (e.g. iam-secrets.enc.yaml). Only username/password leaf
  # fields are encrypted so the rest of each file (realm/client names,
  # roles, etc.) stays readable in Git diffs. The .enc.yaml suffix is the
  # hard marker that a file is (or must be) SOPS-encrypted.
  - path_regex: argocd/clusters/.*/values/.*\.enc\.yaml$
    encrypted_regex: "^(username|password)$"

    # Local dev age public key — see macOS's default sops key file
    # (~/Library/Application Support/sops/age/keys.txt) for the matching
    # private key (never commit the private key).
    age: age1tnz3fux4w76dzm6swlf09zflxsku0haf0hl6f4g4a89sxs9y0cxs30eq4u


  - path_regex: argocd/clusters/remote/.*\.enc\.yaml$
    encrypted_regex: "^(username|password)$"

    # Local dev age public key — see macOS's default sops key file
    # (~/Library/Application Support/sops/age/keys.txt) for the matching
    # private key (never commit the private key).
    age: age1upcrchtv9xg5jgj09au80wk8p9h7rmxwm709lumq79mngrp6ss2sk8zkzh