# Frontend service overrides for dev, layered onto apps/frontend/values.yaml
# via the $values ref in projects/applications/frontend.yaml

global:
  environment: dev

gateway:
  hosts:
    domain: ""

image:
  repository: frontend # Built locally via `nerdctl build -t frontend:local ...`
  tag: local
  pullPolicy: Never # Use the local nerdctl image, never pull from a registry

service:
  port: 80 # nginx port

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilization: 70
