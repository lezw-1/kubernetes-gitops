# Gateway overrides for staging, layered onto apps/gateway/values.yaml
# via the $values ref in argocd/networking/gateway/staging.yaml

global:
  environment: staging

gateway:
  tls:
    enabled: true
    selfSigned: false
  hosts:
    domain: ""
    email: ""
  nodePort:
    enabled: false
  timeout:
    requestTimeout: 1800s
