# Argo CD manages its own Helm install once bootstrapped (self-management).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.1.3 # Pinned chart version — bump deliberately, re-sync to upgrade
      helm:
        valueFiles:
          - $values/bootstrap/argocd/values.yaml
    - repoURL: https://github.com/lezw-1/kubernetes-deployment
      targetRevision: dev
      ref: values # Aliased so the chart source above can reference $values

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true # Remove resources no longer defined in Git
      selfHeal: true # Revert manual drift back to match Git
    syncOptions:
      - CreateNamespace=true # Auto-create the destination namespace
