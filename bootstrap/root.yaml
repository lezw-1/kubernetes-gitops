# App-of-apps root Application — each cluster runs its own independent Argo CD
# install, so this only pulls in this cluster's subset of child Applications.
# targetRevision and directory.include below are placeholders, substituted by
# bootstrap.sh from its TARGET_ENV variable before this file is applied
# (default: dev; the CI pipeline sets TARGET_ENV=prod).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: root

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  source:
    # Git repository containing the child Application manifests.
    repoURL: https://github.com/lezw-1/kubernetes-gitops

    # Branch this cluster's Applications are picked up from. Placeholder,
    # substituted by bootstrap.sh with its TARGET_ENV value (together with
    # directory.include below) — e.g. "prod" for the staging/prod cluster.
    targetRevision: __TARGET_ENV__

    # Path within the repo containing child Application manifests.
    path: argocd

    directory:
      # Picks up per-service subfolders, e.g. argocd/frontend/.
      recurse: true

      # Which per-env Application files this cluster loads, plus the
      # platform singletons (install.yaml). Placeholder, substituted by
      # bootstrap.sh from TARGET_ENV.
      # Allowed values: "**/{dev,install}.yaml", "**/{staging,prod,install}.yaml".
      include: "__ROOT_INCLUDE__"

  destination:
    # Target cluster API server — in-cluster (this cluster's own Argo CD).
    server: https://kubernetes.default.svc

    # Child Applications live here.
    namespace: argocd

  # Fully automated GitOps sync — no manual apply needed for child apps.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true
