# Gateway overrides for local (Rancher Desktop), layered onto apps/gateway/values.yaml
# via the $values ref in argocd/networking/gateway/local.yaml

global:
  environment: local

gateway:
  tls:
    enabled: true
    selfSigned: true
  hosts:
    domain: ""
    email: ""
  nodePort:
    enabled: true
    http: 32080
    https: 32443
  timeout:
    requestTimeout: 1800s
