# Gateway overrides for dev, layered onto apps/gateway/values.yaml
# via the $values ref in argocd/networking/gateway/dev.yaml

global:
  environment: dev

gateway:
  tls:
    enabled: true
    selfSigned: false
  hosts:
    domain: "test.de"
    email: "test@test.de"
  nodePort:
    enabled: false
  timeout:
    requestTimeout: 1800s
