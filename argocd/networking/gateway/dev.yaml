apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0" # Needs namespace/certs-manager/gateway-controller/gateway-class first
spec:
  project: default

  sources:
    - repoURL: https://github.com/lezw-1/kubernetes-gitops
      targetRevision: dev
      path: platform/networking/gateway # Helm chart source
      helm:
        valueFiles:
          - $values/clusters/dev/gateway.yaml # Env-specific overrides
    - repoURL: https://github.com/lezw-1/kubernetes-gitops
      targetRevision: dev
      ref: values # Second source aliased so the path above can reference $values

  destination:
    server: https://kubernetes.default.svc
    namespace: networking # Shared with the other networking singletons — resources are suffixed per env

  syncPolicy:
    automated:
      prune: true # Remove resources no longer defined in Git
      selfHeal: true # Revert manual drift back to match Git