# Singleton — cert-manager, one instance per cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: networking-certs-manager

  # Namespace the Application resource itself lives in.
  namespace: argocd

  annotations:
    # Needs the networking namespace first.
    argocd.argoproj.io/sync-wave: "-2"

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  source:
    # Git repository containing the Helm chart.
    repoURL: https://github.com/lezw-1/kubernetes-gitops

    # Branch tracked for the chart source.
    targetRevision: prod

    # Path to the cert-manager Helm chart.
    path: helm/platform/networking/certs-manager

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace cert-manager is deployed into.
    namespace: networking

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true
