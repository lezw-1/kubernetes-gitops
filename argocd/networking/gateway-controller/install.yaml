# Singleton — Envoy Gateway controller, one instance per cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking-gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # Needs the networking namespace first
spec:
  project: default

  source:
    repoURL: https://github.com/lezw-1/kubernetes-gitops
    targetRevision: prod
    path: helm/platform/networking/gateway-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: networking

  syncPolicy:
    automated:
      prune: true # Remove resources no longer defined in Git
      selfHeal: true # Revert manual drift back to match Git
    syncOptions:
      - CreateNamespace=true # Auto-create the destination namespace
      - ServerSideApply=true # CRDs here exceed the 262144-byte last-applied-configuration limit
