# App-of-apps root Application — shared by all three clusters. targetRevision
# and path are placeholders: bootstrap.sh substitutes __ENV__=dev/__DIR__=dev
# for the dev cluster; the CI pipeline substitutes __ENV__=staging/__DIR__=staging
# for the staging cluster and __ENV__=prod/__DIR__=prod for the prod cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: root

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  source:
    # Git repository containing the child Application manifests.
    repoURL: https://github.com/lezw-1/kubernetes-gitops

    # Branch this cluster's Applications are picked up from. Placeholder,
    # substituted before this file is applied.
    targetRevision: __ENV__

    # Path containing this cluster's Application manifests. Placeholder,
    # substituted before this file is applied — argocd/clusters/dev, argocd/clusters/staging, or argocd/clusters/prod.
    path: argocd/clusters/__DIR__

    directory:
      # Every file directly under argocd/clusters/__DIR__/ is a child manifest.
      # Non-recursive (the default) — argocd/clusters/__DIR__/values/ is a nested
      # subdirectory but is naturally excluded since it's not scanned.
      include: "*.yaml"

  destination:
    # Target cluster API server — in-cluster (this cluster's own Argo CD).
    server: https://kubernetes.default.svc

    # Child Applications live here.
    namespace: argocd

  # Fully automated GitOps sync — no manual apply needed for child apps.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true
