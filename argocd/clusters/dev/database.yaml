# Database service — self-hosted MongoDB, no authentication.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: database

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  # Multi-source config: the database Helm chart plus a values-only Git source.
  sources:
    # Database Helm chart source.
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for the chart source.
      targetRevision: dev

      # Path to the database Helm chart.
      path: helm/apps/database

      helm:
        valueFiles:
          # Local-cluster overrides, supplied by the $values Git source referenced below.
          - $values/argocd/clusters/dev/values/database.yaml

    # Git source providing only values files, referenced via the `values` alias.
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for values files.
      targetRevision: dev

      # Aliased so the chart source above can reference $values.
      ref: values

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the database app is deployed into — shared with platform-api/iam.
    namespace: ai-system-dev

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true

    managedNamespaceMetadata:
      labels:
        # Required for HTTPRoutes to attach to the shared gateway.
        team: gateway-1
