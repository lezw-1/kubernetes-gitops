# Platform API service overrides for the local cluster, layered onto
# apps/api/values.yaml via the $values ref in argocd/clusters/dev/api.yaml.

# Global: shared across templates.
global:
  # Deployment environment name, used in hostnames and resource suffixes.
  environment: dev

# Gateway: HTTPRoute hostname configuration.
gateway:
  hosts:
    # Default: empty disables hostname-based routing (route matches any host) —
    # matches iam's pattern, since this is a subpath API, not the root app.
    domain: ""

# Image: container image settings.
image:
  # Built locally via `nerdctl build -t api:local ...`.
  repository: api

  # Local image tag.
  tag: local

  # Allowed values: Always, IfNotPresent, Never
  # Use the local nerdctl image, never pull from a registry.
  pullPolicy: Never

# Service: ClusterIP configuration.
service:
  # FastAPI/uvicorn listen port.
  port: 8000

# HPA: horizontal pod autoscaler.
hpa:
  # Enabled in dev to exercise autoscaling behavior.
  enabled: true

  # Minimum pod count.
  minReplicas: 1

  # Maximum pod count.
  maxReplicas: 5

  # Target average CPU utilization percentage for scaling.
  targetCPUUtilization: 70

# MongoUrl: in-cluster MongoDB, no authentication (see helm/apps/database).
mongoUrl: "mongodb://database:27017"

# Iam: matches the iam app's dev deployment, same namespace.
iam:
  apiHost: "http://iam:8080"
  subpath: "/iam"

# Multiagent: not yet migrated into this repo — point this at a local/dev
# multiagent instance until it is.
multiagent:
  url: ""
  timeout: 1200
