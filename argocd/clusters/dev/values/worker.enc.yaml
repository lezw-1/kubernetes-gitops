# Worker service overrides for the local cluster, layered onto
# helm/apps/worker/values.yaml via the SECRETS_FILE env in the sops-helm
# plugin source (argocd/clusters/dev/worker.yaml). Only the
# secret.anthropicApiKey leaf field below is SOPS-encrypted — the rest of
# this file stays plaintext so it's readable in Git diffs.
global:
    environment: dev
image:
    # Built locally via `nerdctl build -t worker:local ...`.
    repository: worker
    tag: local
    pullPolicy: Never
database:
    port: 27017
mongoUrl: mongodb://database:27017
broker:
    port: 6379
    url: redis://broker:6379/0
service:
    port: 8000
pool: prefork
secret:
    anthropicApiKey: ""
resources:
    requests:
        cpu: 250m
        memory: 512Mi
