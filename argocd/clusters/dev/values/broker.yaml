# Broker service overrides for the local cluster, layered onto
# helm/apps/broker/values.yaml via the $values ref in argocd/clusters/dev/broker.yaml.

# Global: shared across templates.
global:
  # Deployment environment name, used in resource suffixes.
  environment: dev

# Image: Redis server container image settings.
image:
  # Public image — no registry secret needed.
  repository: redis

  # Upgrade intentionally by changing this value.
  tag: "8"

  # Allowed values: Always, IfNotPresent, Never
  pullPolicy: IfNotPresent

# Service: ClusterIP configuration.
service:
  # Redis listen port.
  port: 6379

# Storage: dev cluster PVC request size.
storage: 1Gi

# StorageClassName: no CSI StorageClass wired up for local dev — renders a
# guarded hostPath PV instead (see helm/apps/broker/templates/pv.yaml).
storageClassName: ""

# Resources: compute reserved for the Redis container.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 50m
    memory: 64Mi
