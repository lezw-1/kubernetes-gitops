# Frontend service overrides for the remote cluster's staging environment,
# rendered by the sops-helm Config Management Plugin (repository is
# SOPS-encrypted — real Cloudfleet registry path).
# Global: shared across templates.
global:
    # Deployment environment name, used in hostnames and resource suffixes.
    environment: staging
# Gateway: HTTPRoute hostname configuration.
gateway:
    hosts:
        # Default: empty disables hostname-based routing (route matches any host).
        domain: ""
    # Attaches this route to the shared cluster-wide Gateway singleton, which
    # only runs as "prod" (see helm/platform/networking/gateway) even though
    # this app's own environment is "staging".
    targetEnvironment: prod
# Image: container image settings.
image:
    # Cloudfleet private registry path. SOPS-encrypted — real registry
    # host; decrypt/edit via `sops` rather than by hand.
    repository: ENC[AES256_GCM,data:JwCyIg9XvfSDYPN0jsoFUddeIzfu7FZmekkJX9DBwZJtyUFuStPQA4k6PgQs6bsGhWLq8u2uk8VcVww+jFJ6NaeQf0XqqwvCqyS/TA==,iv:TOTQJkZOqm8n8lm1ULA9XIRdtGmnS3/rrrV4eq13g8E=,tag:z8fWxqrxryM0ti7N1oAcFg==,type:str]
    # Image tag — bumped by hand once the source repo publishes a new image (see README).
    tag: staging
    # Allowed values: Always, IfNotPresent, Never
    # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
    pullPolicy: Always
# Service: ClusterIP configuration.
service:
    # nginx listen port.
    port: 80
# HPA: horizontal pod autoscaler.
hpa:
    # Enabled in staging to exercise autoscaling behavior.
    enabled: true
    # Minimum pod count.
    minReplicas: 1
    # Maximum pod count.
    maxReplicas: 5
    # Target average CPU utilization percentage for scaling.
    targetCPUUtilization: 70
