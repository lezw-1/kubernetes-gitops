# Frontend service — React dashboard, prod environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: frontend-prod

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  # Single source, rendered by the sops-helm Config Management Plugin
  # (argocd/clusters/remote/values/argocd-cmp.yaml: configs.cmp.plugins.sops-helm)
  # instead of native Helm, since its values file is SOPS-encrypted and
  # native Helm value files can't decrypt it. Checked out at repo root so
  # the plugin can read both the chart (helm/apps/frontend) and the
  # values file (argocd/clusters/remote/values/) from one source.
  sources:
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for the chart source.
      targetRevision: prod

      # Repo root — see comment above for why.
      path: .

      helm:
        valueFiles:
          # Env-specific overrides, supplied by the $values Git source referenced below.
          - $values/argocd/clusters/prod/values/frontend.yaml

        env:
          # Path to the frontend Helm chart, relative to repo root.
          - name: CHART_PATH
            value: helm/apps/frontend

      # Branch tracked for values files.
      targetRevision: prod

      # Aliased so the chart source above can reference $values.
      ref: values

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the frontend app is deployed into.
    namespace: ai-system-prod

  # Manual sync only — no automated block, so promotion to prod requires an explicit sync in Argo CD.
  syncPolicy:
    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true

    managedNamespaceMetadata:
      labels:
        # Required for HTTPRoutes to attach to the shared gateway.
        team: gateway-1
