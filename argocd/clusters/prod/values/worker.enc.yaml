# Worker service overrides for prod, layered onto helm/apps/worker/values.yaml
# via the SECRETS_FILE env in the sops-helm CMP source (argocd/clusters/prod/worker.yaml).
#
# secret.anthropicApiKey below is SOPS-encrypted — only that leaf field; the
# rest of this file stays plaintext so it's readable in Git diffs.
global:
    environment: prod
image:
    # Cloudfleet private registry path. SOPS-encrypted — real registry
    # host; decrypt/edit via `sops` rather than by hand.
    repository: ENC[AES256_GCM,data:7Q32aktf7c+MREI55GQVAOFg+9WkYsy2NSShn3lqrjXKgEUDkELd1yl2FR3yvE/Fl/ariXEp9Hns2HMAf0es2yPOdAIiFxYzMKA=,iv:TqKkFkDBuKbCvjKDwy8N2o9utNKGygFVvjjHFrkzFG8=,tag:W+Bp6GrNKIPEVfgSS0AhHA==,type:str]
    # Image tag — bumped by hand once the source repo publishes a new image (see README).
    tag: prod
    # Allowed values: Always, IfNotPresent, Never
    # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
    pullPolicy: Always
database:
    port: 27017
mongoUrl: mongodb://database:27017
broker:
    port: 6379
    url: redis://broker:6379/0
service:
    port: 8000
pool: prefork
secret:
    anthropicApiKey: ""
resources:
    requests:
        cpu: 250m
        memory: 512Mi
