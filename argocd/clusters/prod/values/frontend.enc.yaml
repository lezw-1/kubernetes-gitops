# Frontend service overrides for prod, layered onto helm/apps/frontend/values.yaml
# via the SECRETS_FILE env in the sops-helm CMP source (argocd/clusters/prod/frontend.yaml).
# Global: shared across templates.
global:
    # Deployment environment name, used in hostnames and resource suffixes.
    environment: prod
# Gateway: HTTPRoute hostname configuration.
gateway:
    hosts:
        # Default: empty disables hostname-based routing (route matches any host).
        # This field is SOPS-encrypted; decrypt/edit via `sops` rather than by hand.
        domain: ENC[AES256_GCM,data:AywM0qQD1g==,iv:dPuf2OmDbBGP1KUTVopNeZmmLp6dCo1z/Z2vWFUdh2M=,tag:OnpFthtTI5ncynW+7rFdTw==,type:str]
# Image: container image settings.
image:
    # Cloudfleet private registry path. SOPS-encrypted — real registry
    # host; decrypt/edit via `sops` rather than by hand.
    repository: ENC[AES256_GCM,data:WEkKxjARdvgJIlCAV3n+Lbyb0EgKgxdsT6c1lm8zCOkrOLrUhaEOwFrw4kPSSSuay5AY6tfZOmYZMK66lHN6qeeFBnKkS7xJixSThA==,iv:UR7sPm23tA49oQ8aSc4gGByzPVldmGtszRhUKWUOBZw=,tag:Skc7dsaxecssGSQUpUdelg==,type:str]
    # Image tag — bumped by hand once the source repo publishes a new image (see README).
    tag: prod
    # Allowed values: Always, IfNotPresent, Never
    # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
    pullPolicy: Always
# Service: ClusterIP configuration.
service:
    # nginx listen port.
    port: 80
# HPA: horizontal pod autoscaler.
hpa:
    # Enabled in prod to exercise autoscaling behavior.
    enabled: true
    # Minimum pod count.
    minReplicas: 1
    # Maximum pod count.
    maxReplicas: 5
    # Target average CPU utilization percentage for scaling.
    targetCPUUtilization: 70
