# Database overrides for prod, layered onto helm/apps/database/values.yaml
# via the SECRETS_FILE env in the sops-helm CMP source (argocd/clusters/prod/database.yaml).
# Global: shared across templates.
global:
    environment: prod
# Image: MongoDB server container image settings.
image:
    # Public image — no registry secret needed.
    repository: ENC[AES256_GCM,data:rwpKDjU=,iv:mVzw5lVereBJtNpt9IjElDHc5rCQnHsDpHveOZ9Om7k=,tag:+eHBdZT6r2SeOfIySmjYcQ==,type:str]
    tag: "8"
    # Allowed values: Always, IfNotPresent, Never
    pullPolicy: IfNotPresent
# Service: ClusterIP configuration.
service:
    port: 27017
# Storage: prod cluster PVC request size.
storage: 10Gi
# StorageClassName: no CSI StorageClass wired up yet for prod — renders a
# guarded hostPath PV instead (see helm/apps/database/templates/pv.yaml).
storageClassName: ""
# Resources: compute reserved for the MongoDB container.
resources:
    requests:
        cpu: 500m
        memory: 512Mi
# Migrate: the schema-migration Job's image settings.
migrate:
    image:
        # Cloudfleet private registry path. SOPS-encrypted — real registry
        # host; decrypt/edit via `sops` rather than by hand.
        repository: ENC[AES256_GCM,data:iMxlALjbcHOCi9ewzJn3mno+qlYO0F+ybT0SOf6pDBLMQFTlMWXlNgeqIDeJe7WCxBosOmAlHUstKPACeMjOuwohxIYbsfdTgMWpOXzgm6qUdTjP,iv:fAjXxOmUYrX0rJhBnmgXudlKF2epoQUBq9pJSXqhDgw=,tag:nYh8efG1uZ5WKAu0sYdfwg==,type:str]
        # Image tag — bumped by hand once the source repo publishes an image (see README).
        tag: prod
        # Allowed values: Always, IfNotPresent, Never
        # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
        pullPolicy: Always
