# Platform API service — FastAPI gateway backed by MongoDB and Keycloak, prod environment.
#
# TODO: values/platform-api.yaml below is still plaintext with placeholder
# values — no real Cloudfleet registry path is known yet for this service.
# Once real values are filled in, encrypt image.repository (and mongoUrl if
# it carries credentials) with `sops`, rename the file to platform-api.enc.yaml,
# and switch this Application to the sops-helm CMP source (see iam.yaml or
# frontend.yaml on staging/prod for the exact pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: platform-api-prod

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  # Multi-source config: the platform-api Helm chart plus a values-only Git source.
  sources:
    # Platform API Helm chart source.
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for the chart source.
      targetRevision: prod

      # Path to the platform-api Helm chart.
      path: helm/apps/platform-api

      helm:
        valueFiles:
          # Cluster overrides, supplied by the $values Git source referenced below.
          - $values/argocd/clusters/prod/values/platform-api.yaml

    # Git source providing only values files, referenced via the `values` alias.
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for values files.
      targetRevision: prod

      # Aliased so the chart source above can reference $values.
      ref: values

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the platform-api app is deployed into.
    namespace: ai-system-prod

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true

    managedNamespaceMetadata:
      labels:
        # Required for HTTPRoutes to attach to the shared gateway.
        team: gateway-1
