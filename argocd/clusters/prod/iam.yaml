# IAM service — Keycloak-based authentication and token issuance, prod environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: iam-prod

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  # Single source, rendered by the sops-helm Config Management Plugin
  # (argocd/clusters/prod/values/argocd-cmp.yaml: configs.cmp.plugins.sops-helm)
  # instead of native Helm, since its values file is SOPS-encrypted and
  # native Helm value files can't decrypt it. Checked out at repo root so
  # the plugin can read both the chart (helm/apps/iam) and the values
  # file (argocd/clusters/prod/values/) from one source.
  sources:
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for this source.
      targetRevision: prod

      # Repo root — see comment above for why.
      path: .

      plugin:
        # Must match a key under configs.cmp.plugins in argocd-cmp.yaml.
        name: sops-helm

        env:
          # Path to the iam Helm chart, relative to repo root.
          - name: CHART_PATH
            value: helm/apps/iam

          # Env-specific overrides, relative to repo root (SOPS-encrypted —
          # only username/password/domain/email leaf fields; the rest stays
          # plaintext — decrypted by the plugin before rendering).
          - name: SECRETS_FILE
            value: argocd/clusters/prod/values/iam.enc.yaml

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the iam app is deployed into.
    namespace: ai-system-prod

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true

    managedNamespaceMetadata:
      labels:
        # Required for HTTPRoutes to attach to the shared gateway.
        team: gateway-1
