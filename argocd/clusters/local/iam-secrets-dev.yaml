# IAM realm/client/user Secrets — split from iam-dev.yaml so a SOPS
# decryption failure here can't block that Application's Deployment/
# Service/HTTPRoute from syncing (see design-for-failure guidance).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: iam-secrets

  # Namespace the Application resource itself lives in.
  namespace: argocd

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  # Single source, rendered by the sops-helm Config Management Plugin
  # (argocd/clusters/local/values/argocd-cmp.yaml: configs.cmp.plugins.sops-helm)
  # instead of native Helm, since its values file is SOPS-encrypted and
  # native Helm value files can't decrypt it. Checked out at repo root so
  # the plugin can read both the chart (helm/apps/iam-secrets) and the
  # values files (argocd/clusters/local/values/) from one source.
  sources:
    - repoURL: https://github.com/lezw-1/kubernetes-gitops

      # Branch tracked for this source.
      targetRevision: dev

      # Repo root — see comment above for why.
      path: .

      plugin:
        # Must match a key under configs.cmp.plugins in argocd-cmp.yaml.
        name: sops-helm

        env:
          # Path to the iam-secrets Helm chart, relative to repo root.
          - name: CHART_PATH
            value: helm/apps/iam-secrets

          # Realm/client/user Secret overrides, relative to repo root
          # (SOPS-encrypted — decrypted by the plugin before rendering).
          - name: SECRETS_FILE
            value: argocd/clusters/local/values/iam-secrets.enc.yaml

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the Secrets are deployed into — same as the iam Application,
    # since these Secrets belong to that service.
    namespace: ai-system-dev

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true
