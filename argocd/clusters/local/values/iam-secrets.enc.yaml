# IAM realm/client/user Secret overrides for the local cluster, layered onto
# helm/apps/iam-secrets/values.yaml via the sops-helm plugin source in
# argocd/clusters/local/iam-secrets-dev.yaml.
# Secrets: realm, client, and user definitions materialized as Kubernetes
# Secrets by templates/secrets.yaml.
secrets:
    # Realm definitions, keyed by a values-safe name.
    realms:
        aiSystem:
            # Realm name.
            realm: ai-system
            # Whether the realm is enabled.
            enabled: true
            # Whether new users must verify their email.
            verifyEmail: false
            # Required actions disabled at realm creation.
            requiredActionsToDisable:
                - VERIFY_PROFILE
    # Client definitions, keyed by clientId.
    clients:
        chronsorting:
            # Keycloak client ID.
            clientId: chronsorting
            # Whether the client is enabled.
            enabled: true
            # Whether the client can authenticate without a client secret.
            publicClient: false
            # Whether Resource Owner Password Credentials grant is allowed.
            directAccessGrantsEnabled: false
            # Client roles to create.
            roles:
                - viewer
        frontend:
            clientId: frontend
            enabled: true
            publicClient: true
            directAccessGrantsEnabled: true
            roles:
                - viewer
    # User definitions, keyed by a values-safe name.
    users:
        user1:
            # User email address.
            email: user1@ai-system.local
            # User first name.
            firstName: User
            # User last name.
            lastName: One
            # Whether the user is enabled.
            enabled: true
            # Whether the user's email is marked verified.
            emailVerified: true
            # Keycloak login username.
            # Default: empty — never commit a real value here. This field is
            # SOPS-encrypted; decrypt/edit via `sops` rather than by hand.
            username: ENC[AES256_GCM,data:emo+0y0=,iv:1EPeKBZ6ZVDjszm+y3Z/KTFsgA9mZrIeqVo8Jd7/Zuk=,tag:djXpJHzGRvVDJ1t1EpZmTg==,type:str]
            # Keycloak login password.
            # Default: empty — same rule as username above; never commit a real password.
            password: ENC[AES256_GCM,data:1s0nCn0=,iv:LodWjns9qU8lcrOAF53HT6Ge9Qbgy+uD/PXr33htKV4=,tag:WHAw4Rxu6OSB1tS2tpQ9Yg==,type:str]
            # Client roles assigned to this user.
            roles:
                - client: chronsorting
                  role: viewer
                - client: frontend
                  role: viewer
        user2:
            email: user2@ai-system.local
            firstName: User
            lastName: Two
            enabled: true
            emailVerified: true
            # See user1's username/password comments above — never commit real values.
            username: ENC[AES256_GCM,data:HyYMbKk=,iv:uIdd5WTO0Qb2mIFuc9CFEo0DgS8/80cIVFsYYoZca0w=,tag:hghHfK1vM/pP9uXcGtnABA==,type:str]
            password: ENC[AES256_GCM,data:G3KW/uY=,iv:hUM3ye0W/H64eTxg2f4QLlqQphvc8sn3FtzSZ/KhHds=,tag:co9G7XBnfjzAPToRo8xDQg==,type:str]
            roles: []
    admin:
        username: ENC[AES256_GCM,data:Jc/Fopc=,iv:HfaJvuwHgx77W7gGkO2/X9yWAURnLtKVtNElD3j8vR4=,tag:pIZaVg3oc6fyFucPd7+7IA==,type:str]
        password: ENC[AES256_GCM,data:4zAcFqWnzZ6CWvkdFT4Gc3H7Qs92ZGNZ,iv:48sS9DgdSdPnNOuz9DjptpKRFMyrpJdNIEsKYK8H49A=,tag:5Qt4Ju9KmjSephyjjhZEvQ==,type:str]
