# Frontend service overrides for staging, layered onto apps/frontend/values.yaml
# via the $values ref in the staging branch's argocd/clusters/staging/frontend.yaml.

# Global: shared across templates.
global:
  # Deployment environment name, used in hostnames and resource suffixes.
  environment: staging

# Gateway: HTTPRoute hostname configuration.
gateway:
  hosts:
    # Default: empty disables hostname-based routing (route matches any host).
    domain: ""

# Image: container image settings.
image:
  # CI updates the tag below on each push.
  repository: <CF_ORG_ID>.<CF_CR_REGION>.registry.cloudfleet.dev/frontend

  # CI overwrites this with the commit SHA on each push.
  tag: staging

  # Allowed values: Always, IfNotPresent, Never
  pullPolicy: Always

# Service: ClusterIP configuration.
service:
  # nginx listen port.
  port: 80

# HPA: horizontal pod autoscaler.
hpa:
  # Enabled in staging for load-based scaling.
  enabled: true

  # Minimum pod count.
  minReplicas: 1

  # Maximum pod count.
  maxReplicas: 5

  # Target average CPU utilization percentage for scaling.
  targetCPUUtilization: 70
