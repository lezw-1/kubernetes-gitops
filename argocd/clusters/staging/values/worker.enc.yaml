# Worker service overrides for staging, layered onto helm/apps/worker/values.yaml
# via the SECRETS_FILE env in the sops-helm CMP source (argocd/clusters/staging/worker.yaml).
#
# secret.anthropicApiKey below is SOPS-encrypted — only that leaf field; the
# rest of this file stays plaintext so it's readable in Git diffs.
global:
    environment: staging
image:
    # Cloudfleet private registry path. SOPS-encrypted — real registry
    # host; decrypt/edit via `sops` rather than by hand.
    repository: ENC[AES256_GCM,data:cKhDYpjl6uz+JrRHsAKnR68eMkIe2RYhvHpS39cfzcMtd0nGLDgRFndS/jr+2qpWGt8qY0wwFAblLGiVnzonAobRKygFn6ZFd+0=,iv:lIZxlBU+TKnEbaAMmYnGXoxJqHhCceHORyoheETOAkM=,tag:amGN9CZDjXHcO/gAIx91eQ==,type:str]
    # Image tag — bumped by hand once the source repo publishes a new image (see README).
    tag: staging
    # Allowed values: Always, IfNotPresent, Never
    # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
    pullPolicy: Always
database:
    port: 27017
mongoUrl: mongodb://database:27017
broker:
    port: 6379
    url: redis://broker:6379/0
# Model: pinned to match llm's model below in staging's llm.enc.yaml —
# see helm/apps/worker/values.yaml's comment on this field for why a
# mismatch here fails every LLM call.
model: qwen2.5:7b
service:
    port: 8000
pool: prefork
secret:
    anthropicApiKey: ""
resources:
    requests:
        cpu: 500m
        memory: 1Gi
    limits:
        cpu: 500m
        memory: 1Gi
concurrency: 2
