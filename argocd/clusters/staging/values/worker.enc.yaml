# Worker service overrides for staging, layered onto helm/apps/worker/values.yaml
# via the SECRETS_FILE env in the sops-helm CMP source (argocd/clusters/staging/worker.yaml).
#
# secret.anthropicApiKey below is SOPS-encrypted — only that leaf field; the
# rest of this file stays plaintext so it's readable in Git diffs.
global:
    environment: staging
image:
    # Not yet migrated into this repo's CI — worker's source still lives
    # only in kubernetes-ai-system. Point this at a real published image
    # once it's split out and built, like kubernetes-api was.
    repository: ""
    tag: ""
    pullPolicy: Always
database:
    port: 27017
mongoUrl: mongodb://database:27017
broker:
    port: 6379
    url: redis://broker:6379/0
service:
    port: 8000
pool: prefork
secret:
    anthropicApiKey: ""
resources:
    requests:
        cpu: 250m
        memory: 512Mi
