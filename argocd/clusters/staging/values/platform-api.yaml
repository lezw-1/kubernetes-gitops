# Platform API service overrides for staging, layered onto
# helm/apps/platform-api/values.yaml via the $values ref in
# argocd/clusters/staging/platform-api.yaml.
#
# PLACEHOLDER — none of this is real yet. Fill in the real Cloudfleet
# registry path (see frontend.enc.yaml for the pattern: <CF_ORG_ID>.
# <CF_CR_REGION>.registry.cloudfleet.dev/platform-api) and a reachable
# mongoUrl/multiagent.url once those exist, then SOPS-encrypt the sensitive
# fields (see this file's header TODO in platform-api.yaml).

# Global: shared across templates.
global:
  # Deployment environment name, used in hostnames and resource suffixes.
  environment: staging

# Gateway: HTTPRoute hostname configuration.
gateway:
  hosts:
    # Default: empty disables hostname-based routing (route matches any host) —
    # matches iam's pattern, since this is a subpath API, not the root app.
    domain: ""

# Image: container image settings.
image:
  # PLACEHOLDER — replace with the real Cloudfleet registry path and
  # SOPS-encrypt before deploying (see frontend.enc.yaml for the pattern).
  repository: "<CF_ORG_ID>.<CF_CR_REGION>.registry.cloudfleet.dev/platform-api"

  # Image tag — bumped by hand once the source repo publishes a new image (see README).
  tag: staging

  # Allowed values: Always, IfNotPresent, Never
  # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
  pullPolicy: Always

# Service: ClusterIP configuration.
service:
  # FastAPI/uvicorn listen port.
  port: 8000

# HPA: horizontal pod autoscaler.
hpa:
  # Enabled in staging to exercise autoscaling behavior.
  enabled: true

  # Minimum pod count.
  minReplicas: 1

  # Maximum pod count.
  maxReplicas: 5

  # Target average CPU utilization percentage for scaling.
  targetCPUUtilization: 70

# MongoUrl: MongoDB is not yet migrated into this repo — point this at a
# reachable staging MongoDB instance once one exists. SOPS-encrypt if it
# carries credentials.
mongoUrl: ""

# Iam: matches the iam app's staging deployment, same namespace.
iam:
  apiHost: "http://iam:8080"
  subpath: "/iam"

# Multiagent: not yet migrated into this repo — point this at a reachable
# staging multiagent instance once one exists.
multiagent:
  url: ""
  timeout: 1200
