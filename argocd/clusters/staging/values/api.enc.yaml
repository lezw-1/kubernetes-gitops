# Platform API service overrides for staging, layered onto helm/apps/api/values.yaml
# via the SECRETS_FILE env in the sops-helm plugin source (argocd/clusters/staging/api.yaml).
#
# repository below is SOPS-encrypted (real Cloudfleet registry host) — only
# that leaf field; the rest of this file stays plaintext so it's readable in
# Git diffs.
# Global: shared across templates.
global:
    # Deployment environment name, used in hostnames and resource suffixes.
    environment: staging
# Gateway: HTTPRoute hostname configuration.
gateway:
    hosts:
        # Default: empty disables hostname-based routing (route matches any host) —
        # matches iam's pattern, since this is a subpath API, not the root app.
        domain: ENC[AES256_GCM,data:kMhCZuniLw==,iv:dAlhCBZY+M7TxQVHS07YTodk8eEQxbIut6pMbssIy1s=,tag:6/sGTdfC6UAbbfeKzLEYrw==,type:str]
# Image: container image settings.
image:
    # Cloudfleet private registry path. SOPS-encrypted — real registry
    # host; decrypt/edit via `sops` rather than by hand.
    repository: ENC[AES256_GCM,data:Hm5xjlDCuTYWqnFMVgQZjfy9lpZWNKPXruFErsoEg5TintepQNMNCwFxjYGwESfutBF8yYdowj9EIvY0UcyLwrI7ywriyjU=,iv:4Ak5chlt9E9eEv5dDt7Y0qn67qw4tUjvMYBUJJFPQko=,tag:4ZXYLYQpMBm629FEeGtzzw==,type:str]
    # Image tag — bumped by hand once the source repo publishes a new image (see README).
    tag: b62c4180c430391b057c12f2d5ec2d5bf7a7be6d
    # Allowed values: Always, IfNotPresent, Never
    # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
    pullPolicy: Always
# Service: ClusterIP configuration.
service:
    # FastAPI/uvicorn listen port.
    port: 8000
# Resources: compute reserved for the API container.
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 50m
        memory: 128Mi
# HPA: horizontal pod autoscaler.
hpa:
    # Enabled but pinned to a single replica — max was 5, but that let CPU
    # spikes scale it up then immediately back down within the same minute,
    # spinning up short-lived extra pods for no benefit on this low-traffic
    # staging deployment. Matches iam's pattern (also pinned to 1/1).
    enabled: true
    # Minimum pod count.
    minReplicas: 1
    # Maximum pod count.
    maxReplicas: 1
    # Target average CPU utilization percentage for scaling.
    targetCPUUtilization: 70
# MongoUrl: in-cluster MongoDB, no authentication (see helm/apps/database).
mongoUrl: mongodb://database:27017
# Iam: matches the iam app's staging deployment, same namespace.
iam:
    apiHost: http://iam:8080
    subpath: /iam
# Broker: in-cluster Redis, no authentication (see helm/apps/broker).
broker:
    port: 6379
    url: redis://broker:6379/0
# Worker: matches the worker app's staging deployment, same namespace.
worker:
    url: http://worker:8000
    timeout: 1200
