# CMP overrides for Argo CD's repo-server, layered on values/argocd.yaml via
# helm.valueFiles in argocd/bootstrap/install.yaml.
configs:
  # Config Management Plugins — extends manifest generation beyond native Helm/Kustomize.
  cmp:
    # Creates the argocd-cmp-cm ConfigMap holding the plugin.yaml below.
    create: true

    # sops-helm: decrypts a SOPS values file, then helm-templates the chart
    # with it. Used by Applications with sources[].plugin.name: sops-helm
    # (e.g. networking-gateway.yaml) instead of sources[].helm.
    plugins:
      sops-helm:
        generate:
          command: [sh, -c]
          args:
            - |
              set -eu

              # CHART_PATH and SECRETS_FILE come from sources[].plugin.env;
              # the CMP server auto-prefixes each name with ARGOCD_ENV_.
              tmpdir=$(mktemp -d)
              trap 'rm -rf "$tmpdir"' EXIT INT TERM

              decrypted="$tmpdir/$(basename "$ARGOCD_ENV_SECRETS_FILE")"
              sops -d "$ARGOCD_ENV_SECRETS_FILE" > "$decrypted"

              set -- helm template "$ARGOCD_APP_NAME" "$ARGOCD_ENV_CHART_PATH" \
                --namespace "$ARGOCD_APP_NAMESPACE" \
                -f "$decrypted"

              exec "$@"

# Repo-server sidecar/init container that run the sops-helm plugin above.
repoServer:
  # Downloads sops onto a shared volume — no image bundles both helm and
  # sops, so this composes alpine/helm with a pinned sops release.
  initContainers:
    - name: download-sops
      image: curlimages/curl:8.16.0
      command: [sh, -c]
      args:
        - |
          set -eu

          # Pinned release — bump deliberately, update both checksums below.
          SOPS_VERSION=3.13.3

          case "$(uname -m)" in
            x86_64) ARCH=amd64; SHA256=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b ;;
            aarch64) ARCH=arm64; SHA256=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          curl -fsSL -o /sops-bin/sops \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.${ARCH}"
          echo "${SHA256}  /sops-bin/sops" | sha256sum -c -
          chmod 755 /sops-bin/sops
      volumeMounts:
        - name: sops-bin
          mountPath: /sops-bin

  # cmp-sops-helm: CMP v2 sidecar running the sops-helm plugin above.
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/config-management-plugins/
  extraContainers:
    - name: cmp-sops-helm
      # Pin to match the local helm CLI — avoids template-behavior drift.
      image: alpine/helm:4.2.1
      command: ["/var/run/argocd/argocd-cmp-server"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      env:
        # Where sops reads its decryption key — see sops-age-key volume below.
        - name: SOPS_AGE_KEY_FILE
          value: /helm-secrets-private-keys/key.txt
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: sops-helm.yaml
        - name: cmp-tmp
          mountPath: /tmp
        - name: sops-bin
          mountPath: /usr/local/bin/sops
          subPath: sops
        - name: sops-age-key
          mountPath: /helm-secrets-private-keys
          readOnly: true

  volumes:
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm

    - name: cmp-tmp
      emptyDir: {}

    - name: sops-bin
      emptyDir: {}

    - name: sops-age-key
      # Created out-of-band on the staging cluster, never committed to Git — see README.
      secret:
        secretName: sops-age-key
