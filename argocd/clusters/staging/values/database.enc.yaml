# Database overrides for staging, layered onto helm/apps/database/values.yaml
# via the SECRETS_FILE env in the sops-helm plugin source (argocd/clusters/staging/database.yaml).
#
# repository (migrate job image) below is SOPS-encrypted (real Cloudfleet
# registry host) — only that leaf field; the rest of this file stays
# plaintext so it's readable in Git diffs.
# Global: shared across templates.
global:
    environment: staging
# Image: MongoDB server container image settings.
image:
    # Public image — no registry secret needed.
    repository: ENC[AES256_GCM,data:HaO3yb4=,iv:7BDBIAIWg4Uv0cJ2xLh6xlifqd9m2FbF6AKaukxO7oM=,tag:qrsxA5qQOUJb/ux637WOLw==,type:str]
    tag: "8"
    # Allowed values: Always, IfNotPresent, Never
    pullPolicy: IfNotPresent
# Service: ClusterIP configuration.
service:
    port: 27017
# Storage: staging cluster PVC request size.
storage: 10Gi
# StorageClassName: no CSI StorageClass wired up yet for staging — renders a
# guarded hostPath PV instead (see helm/apps/database/templates/pv.yaml).
storageClassName: ""
# Resources: compute reserved for the MongoDB container.
resources:
    requests:
        cpu: 250m
        memory: 256Mi
    limits:
        cpu: 250m
        memory: 256Mi
# Migrate: the schema-migration Job's image settings.
migrate:
    image:
        # Cloudfleet private registry path. SOPS-encrypted — real registry
        # host; decrypt/edit via `sops` rather than by hand.
        repository: ENC[AES256_GCM,data:boXADs2BzpvvnCSmGlrjpo4x/JowXQbZRZ+8/YIzD+J8l+oSWA76kK+VpRHICCKP5Iw/16rzybIrDRScWHR19muX5nRqUEMcv8T8TDu6vFlTrAcj,iv:GzEDdIw1dGOKlxf6NRi950FDEHXiENKMIv4PLekNNko=,tag:t97+SFr6eGsK0LTZA+Flww==,type:str]
        # Image tag — bumped by hand once the source repo publishes an image (see README).
        tag: staging
        # Allowed values: Always, IfNotPresent, Never
        # Pulled from the private Cloudfleet registry — requires imagePullSecrets.
        pullPolicy: Always
