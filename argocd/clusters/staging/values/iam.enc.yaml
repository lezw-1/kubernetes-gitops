# IAM service overrides for staging, layered onto helm/apps/iam/values.yaml
# via the SECRETS_FILE env in the sops-helm plugin source
# (argocd/clusters/staging/iam.yaml). Only the username/password leaf fields
# under secrets.* below are SOPS-encrypted — the rest of this file stays
# plaintext so it's readable in Git diffs.
# Global: shared across templates.
global:
    # Deployment environment name, used in hostnames and resource suffixes.
    environment: staging
# Gateway: HTTPRoute hostname configuration.
gateway:
    hosts:
        # Default: empty disables hostname-based routing (route matches any host).
        domain: ""
# Image: container image settings.
image:
    # Upgrade intentionally by changing this value — third-party image, not built by this repo's CI.
    repository: quay.io/keycloak/keycloak
    # Upgrade intentionally by changing this value.
    tag: 26.5.5
    # Allowed values: Always, IfNotPresent, Never
    pullPolicy: IfNotPresent
# Subpath: URL prefix Keycloak is served under, behind the shared gateway.
subpath: /iam
# Service: ClusterIP configuration.
service:
    # Keycloak HTTP listen port.
    port: 8080
# TokenExpire: access token lifespan in seconds.
tokenExpire: 3600
# Debug: Keycloak log level.
# Allowed values: DEBUG, INFO, WARN, ERROR
debug: INFO
# HPA: horizontal pod autoscaler.
hpa:
    # Enabled in staging for load-based scaling.
    enabled: true
    # Minimum pod count.
    minReplicas: 1
    # Maximum pod count.
    maxReplicas: 1
    # Target average CPU utilization percentage for scaling.
    targetCPUUtilization: 80
# SecretsProvisioning: seeds realms, clients, and users on install/upgrade.
secretsProvisioning:
    # Enabled in staging to seed the ai-system realm/clients/users, same as dev.
    enabled: true
# Secrets: realm, client, and user definitions materialized as Kubernetes
# Secrets by templates/realms-*.yaml, templates/clients-*.yaml,
# templates/users-*.yaml, templates/admin-credentials.yaml.
secrets:
    # Realm definitions, keyed by a values-safe name.
    realms:
        aiSystem:
            # Realm name.
            realm: ai-system
            # Whether the realm is enabled.
            enabled: true
            # Whether new users must verify their email.
            verifyEmail: false
            # Required actions disabled at realm creation.
            requiredActionsToDisable:
                - VERIFY_PROFILE
    # Client definitions, keyed by clientId.
    clients:
        chronsorting:
            # Keycloak client ID.
            clientId: chronsorting
            # Whether the client is enabled.
            enabled: true
            # Whether the client can authenticate without a client secret.
            publicClient: false
            # Whether Resource Owner Password Credentials grant is allowed.
            directAccessGrantsEnabled: false
            # Client roles to create.
            roles:
                - viewer
        frontend:
            clientId: frontend
            enabled: true
            publicClient: true
            directAccessGrantsEnabled: true
            roles:
                - viewer
    # User definitions, keyed by a values-safe name.
    users:
        user1:
            # User email address.
            email: ENC[AES256_GCM,data:RSjbqZGwqkTHwDzsn+Z+Ul5HlXHc,iv:Ki8NbGrmfTxfjBfF+RIjOm0h8FsrJQ2Hor/9Kax3O70=,tag:p9yRmDb9l6lCjtYhiJ0JJg==,type:str]
            # User first name.
            firstName: User
            # User last name.
            lastName: One
            # Whether the user is enabled.
            enabled: true
            # Whether the user's email is marked verified.
            emailVerified: true
            # Keycloak login username.
            # This field is SOPS-encrypted; decrypt/edit via `sops` rather than by hand.
            username: ENC[AES256_GCM,data:icfxiPc=,iv:ufi1y1iP3aYVl5p0fWmW8RxzDPFzRXOhb1RXO6usvis=,tag:+7Kkiv7Us6rHS8IyTJxIbA==,type:str]
            # Keycloak login password.
            password: ENC[AES256_GCM,data:AD5wWwXpPhNcLhruBOJbi/Lsp4kZzhNe,iv:t5v6StNS1gWCp45TinMDhLjPwytF3M6K5L4x1xWIorg=,tag:ZLVj2/bxFKenzyifQrfCgQ==,type:str]
            # Client roles assigned to this user.
            roles:
                - client: chronsorting
                  role: viewer
                - client: frontend
                  role: viewer
        user2:
            email: ENC[AES256_GCM,data:uLHq7L16VD9pENOI6Mn40EjPe01k,iv:OXFpaGFrPFgXi8uq4DcMYTpSSmu5D/qn6H7axGJLgtI=,tag:NsEYAsqNrwkDUJ4q3jb28Q==,type:str]
            firstName: User
            lastName: Two
            enabled: true
            emailVerified: true
            # See user1's username/password comments above.
            username: ENC[AES256_GCM,data:Sh986qE=,iv:bKWDRhSI/3qLP9F3qWK+VIqwbjB0OX54tHyePtVclEg=,tag:4r17kgkuOK7URBckfOH6Ug==,type:str]
            password: ENC[AES256_GCM,data:rP8dTdxi5sIuAw//w7kkFJSUP5N2ikGH,iv:28T+ZxWNsI+WdJxRj3q6qHyykdhSOTM58o+5PYkO8cQ=,tag:ijEgumdkLkJrb7upO5q/Gw==,type:str]
            roles: []
    admin:
        username: ENC[AES256_GCM,data:KvF+xxE=,iv:exKk92LmMvTSpIxyPTK7jq4mqRRnAYI0ttnRee0i2dY=,tag:zJYCN2JdPAsYmFLQ+4BMNQ==,type:str]
        password: ENC[AES256_GCM,data:SCbRWIV0UN6isEGRX0iUbpgckH5qK1Wa,iv:gyqerSTDeahVmJQGwtSDLIX7sjrL5+ug+Mi4Z7y19tk=,tag:TOv23zP3EGwEk78N91krDg==,type:str]
