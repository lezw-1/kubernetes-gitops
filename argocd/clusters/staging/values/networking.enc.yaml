# Networking singleton overrides for staging, layered onto
# platform/networking/gateway/values.yaml via the SECRETS_FILE env in the
# sops-helm plugin source (argocd/clusters/staging/networking-gateway.yaml).
# Only the gateway component takes per-cluster values today — namespace/
# certs-manager/gateway-controller/gateway-class use static chart defaults
# (single-source, no plugin). The gateway itself is a per-cluster singleton
# too, one instance for this cluster only.
#
# domain/email below are SOPS-encrypted (real hostname + contact email) —
# only those leaf fields; the rest of this file stays plaintext so it's
# readable in Git diffs.
# Global: shared across templates.
global:
    # Deployment environment name, used in resource suffixes.
    environment: staging
# Gateway: shared cluster Gateway configuration.
gateway:
    tls:
        # Enables the HTTPS listener and Certificate/ClusterIssuer resources.
        enabled: true
        # Uses Let's Encrypt instead of a self-signed cert.
        selfSigned: false
    hosts:
        # Public hostname the gateway routes.
        domain: ENC[AES256_GCM,data:a/BM7hT3gg==,iv:PQEZyHHYGzL5Cu4P08SVy+XgZRmsEEMcbCmAVZY2Hj4=,tag:m+E9FjQzwNiZtrEwoupDXg==,type:str]
        # Contact email for the Let's Encrypt ACME account.
        email: ENC[AES256_GCM,data:7brT8xG6eJHSTvrWK+g=,iv:tdQ7fy7Lf+pEI1RNnAmahjUuNqpUGNtapdouoHlQGMc=,tag:yvLEb0zuyF43fA+ksseRoQ==,type:str]
    nodePort:
        # Disabled — staging is fronted by a real LoadBalancer, not NodePort.
        enabled: false
    timeout:
        # Request timeout applied via BackendTrafficPolicy.
        requestTimeout: 1800s
