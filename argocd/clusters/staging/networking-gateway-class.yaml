# Singleton — Envoy GatewayClass "eg", one instance per cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Application resource name, shown in the Argo CD UI.
  name: networking-gateway-class

  # Namespace the Application resource itself lives in.
  namespace: argocd

  annotations:
    # Needs gateway-controller registered first.
    argocd.argoproj.io/sync-wave: "-1"

spec:
  # Bound to AppProject "default" and its guardrails.
  project: default

  source:
    # Git repository containing the Helm chart.
    repoURL: https://github.com/lezw-1/kubernetes-gitops

    # Branch tracked for the chart source.
    targetRevision: staging

    # Path to the GatewayClass Helm chart.
    path: helm/platform/networking/gateway-class

  destination:
    # Target cluster API server — in-cluster.
    server: https://kubernetes.default.svc

    # Namespace the GatewayClass Application resource is deployed into.
    namespace: networking

  # Fully automated GitOps sync — no manual apply needed.
  syncPolicy:
    automated:
      # Remove resources no longer defined in Git.
      prune: true

      # Revert manual drift back to match Git.
      selfHeal: true

    syncOptions:
      # Auto-create the destination namespace.
      - CreateNamespace=true
