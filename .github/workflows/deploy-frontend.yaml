# Deploy Frontend — GitOps tag bump for staging
#
# This repo holds manifests only — no app source/Containerfile lives here.
# The frontend image is built and pushed by the app source repo's own
# pipeline (see ../kubernetes-ai-system cicd.yaml for that pattern). This
# workflow's only job is to point Argo CD at a new image tag by committing
# it to clusters/staging/frontend.yaml on dev.
#
# Trigger manually, or cross-repo from the app source CI once it has pushed
# a new image:
#   gh workflow run deploy-frontend.yaml -f image_tag=<sha>
#
# Prod is intentionally out of scope here — promotion to prod happens
# through a human-reviewed PR from dev to prod (.claude/rules/git.md),
# never an automated commit from this workflow.

name: Deploy Frontend (Staging)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Frontend image tag already pushed to the registry (e.g. commit SHA)"
        required: true
        type: string

permissions:
  contents: write # Needed to commit the tag bump back to dev

jobs:
  bump-staging-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update staging image tag
        # Replaces only the `tag:` line under image: in the staging overlay
        run: |
          sed -i -E "s/^(  tag: ).*/\1${{ inputs.image_tag }} # CI overwrites with commit SHA on each push/" clusters/staging/frontend.yaml

      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clusters/staging/frontend.yaml
          git commit -m "Bump staging frontend tag to ${{ inputs.image_tag }}"
          git push origin dev
