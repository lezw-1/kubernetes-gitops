# Install Argo CD
#
# Required secrets:
#   - CF_ORG_ID:              Cloudfleet organization ID -> run 'cloudfleet organization describe'
#   - CF_ACCESS_TOKEN:        Cloudfleet token ID -> create token via UI and use 'Access Token'
#   - CF_ACCESS_TOKEN_SECRET: Cloudfleet token secret -> create token via UI and use 'Access Token Secret'
#   - CF_CLUSTER_ID_PROD:     Cloudfleet cluster ID for prod -> get via UI 'https://console.cloudfleet.ai/clusters'
#   - SOPS_AGE_KEY_PROD:      Age private key for prod's sops-age-key Secret -> contents of the prod keys.txt (never the dev or staging key)
#   - CF_CLUSTER_ID_STAGING:  Cloudfleet cluster ID for staging -> get via UI 'https://console.cloudfleet.ai/clusters'
#   - SOPS_AGE_KEY_STAGING:   Age private key for staging's sops-age-key Secret -> contents of the staging keys.txt (never the dev or prod key)
#
# Required variables:
#   - DEPLOY_STAGING: 'true' runs install-argocd-staging; false/unset runs teardown-staging instead ->
#                     repo Settings > Secrets and variables > Actions > Variables.
#                     Single flag for staging: true creates/keeps everything in sync, false deletes
#                     every staging resource (Argo CD itself included) on the next push.
#   - DEPLOY_PROD:    'true' runs install-argocd-prod; false/unset runs teardown-prod instead ->
#                     repo Settings > Secrets and variables > Actions > Variables.
#                     Single flag for prod: true creates/keeps everything in sync, false deletes
#                     every prod resource (Argo CD itself included) on the next push.

name: Install Argo CD

on:
  # Bootstraps/re-bootstraps staging and prod — two independent clusters, each
  # only on push to its own branch. Idempotent — helm upgrade --install and
  # kubectl apply are safe to re-run.
  push:
    branches: [staging, prod]

jobs:
  # Four standalone jobs, not a matrix — a matrix's `if:` can't reference
  # `matrix.*` (not in GitHub Actions' context-availability list for
  # jobs.<job_id>.if), so per-branch/per-flag gating has to live in a static
  # condition instead. install-argocd-<env> and teardown-<env> are mutually
  # exclusive (DEPLOY_<ENV> can't be both 'true' and not 'true' at once).
  install-argocd-staging:
    runs-on: ubuntu-latest

    # A push only bootstraps the cluster matching the branch that triggered
    # it. Additionally gated by the DEPLOY_STAGING repo variable — the single
    # flag controlling whether any staging resource gets created at all (see
    # "Required variables" above).
    if: |
      vars.DEPLOY_STAGING == 'true' &&
      github.ref_name == 'staging'

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install Cloudfleet CLI
        run: |
          curl -fsSL https://downloads.cloudfleet.ai/apt/pubkey.gpg | sudo tee /usr/share/keyrings/cloudfleet-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudfleet-archive-keyring.gpg] https://downloads.cloudfleet.ai/apt stable main" | sudo tee /etc/apt/sources.list.d/cloudfleet.list
          sudo apt-get update && sudo apt-get install -y cloudfleet

      - name: Configure kubeconfig
        run: |
          cloudfleet auth add-profile token default ${{ secrets.CF_ORG_ID }} ${{ secrets.CF_ACCESS_TOKEN }} ${{ secrets.CF_ACCESS_TOKEN_SECRET }}
          cloudfleet clusters kubeconfig ${{ secrets.CF_CLUSTER_ID_STAGING }}

      - name: Add Argo Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo

      - name: Install/Upgrade Argo CD
        # Chart version pinned here — bump deliberately, re-run to upgrade.
        # Values read straight from the checked-out repo, ahead of Argo CD
        # existing to apply argocd/bootstrap/install.yaml itself.
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --version 10.1.3 \
            --namespace argocd \
            --create-namespace \
            -f argocd/clusters/staging/values/argocd.yaml \
            -f argocd/clusters/staging/values/argocd-cmp.yaml

      - name: Configure SOPS age key
        # Mirrors the manual `kubectl create secret` step README.md documents
        # for dev, so the sops-helm CMP can decrypt *.enc.yaml on this cluster.
        # Written to a temp file first since --from-file needs a real path.
        run: |
          key_file="$(mktemp)"
          printf '%s' "${{ secrets.SOPS_AGE_KEY_STAGING }}" > "$key_file"
          kubectl create secret generic sops-age-key -n argocd \
            --from-file=key.txt="$key_file" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$key_file"

      - name: Hand self-management over to Argo CD
        # Same argocd/bootstrap/install.yaml bootstrap.sh uses for the dev
        # cluster, with ENV=DIR=staging substituted instead of dev.
        run: |
          sed -e 's/__ENV__/staging/g' -e 's/__DIR__/staging/g' argocd/bootstrap/install.yaml \
            | kubectl apply -f - -n argocd

      - name: Apply the app-of-apps
        # Same argocd/bootstrap/root.yaml bootstrap.sh uses for the dev
        # cluster, with ENV=DIR=staging substituted instead of dev.
        run: |
          sed -e 's/__ENV__/staging/g' -e 's/__DIR__/staging/g' argocd/bootstrap/root.yaml \
            | kubectl apply -f - -n argocd

  teardown-staging:
    runs-on: ubuntu-latest

    # Mirrors install-argocd-staging's trigger, but fires on the opposite
    # DEPLOY_STAGING value — same flag, so the two jobs never both run.
    if: |
      vars.DEPLOY_STAGING != 'true' &&
      github.ref_name == 'staging'

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Cloudfleet CLI
        run: |
          curl -fsSL https://downloads.cloudfleet.ai/apt/pubkey.gpg | sudo tee /usr/share/keyrings/cloudfleet-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudfleet-archive-keyring.gpg] https://downloads.cloudfleet.ai/apt stable main" | sudo tee /etc/apt/sources.list.d/cloudfleet.list
          sudo apt-get update && sudo apt-get install -y cloudfleet

      - name: Configure kubeconfig
        run: |
          cloudfleet auth add-profile token default ${{ secrets.CF_ORG_ID }} ${{ secrets.CF_ACCESS_TOKEN }} ${{ secrets.CF_ACCESS_TOKEN_SECRET }}
          cloudfleet clusters kubeconfig ${{ secrets.CF_CLUSTER_ID_STAGING }}

      - name: Delete every staging resource
        # argocd is deleted first, ahead of the other namespaces, so this
        # doesn't depend on Argo CD's own controller staying up long enough
        # to process every Application (including PreDelete/PostDelete
        # hooks) — trading graceful hook execution for a deletion that can't
        # get stuck waiting on a controller that's being torn down in the
        # same operation.
        #
        # Namespace deletion natively cascades to everything inside it
        # (Deployments, Secrets, Argo CD's own install, its Application/
        # AppProject CRs) — no dependency on Argo CD's own cascade/finalizer
        # mechanism, which none of these Applications opt into. assistant-
        # staging is a separate app namespace from ai-system-staging (the
        # "assistant" Application's own destination), so it's listed
        # explicitly alongside it. ClusterIssuer, GatewayClass, and Argo
        # CD/cert-manager/gateway-controller's own ClusterRole(Binding)s are
        # all cluster-scoped (outside any namespace), so they're deleted
        # explicitly, after the namespace loop — Envoy Gateway holds
        # gateway-exists-finalizer.gateway.networking.k8s.io on GatewayClass
        # eg for as long as any Gateway still references it, and that
        # Gateway only goes away once the networking namespace is deleted.
        # --ignore-not-found makes this safe to rerun and safe on a cluster
        # that was never installed.
        #
        # Namespaces are deleted one at a time with --timeout, since a
        # namespace can hang in Terminating forever if a resource inside it
        # (e.g. an Application/AppProject CR) has a finalizer that only Argo
        # CD's own controller can clear — and that controller's pod may
        # already be gone by the time this runs. On timeout, the namespace's
        # status conditions name exactly what's still blocking it.
        run: |
          # Fail immediately if any delete below times out, so a stuck
          # resource surfaces as a failed job instead of finishing silently.
          set -euo pipefail

          # cert-manager's admission webhooks gate writes to its own CRs,
          # including the finalizer removal below. If cert-manager's pod is
          # already unhealthy for any reason, these configs point at a dead
          # Service and reject the delete outright. Removing them first
          # makes the next step safe regardless of cert-manager's health —
          # they're being torn down anyway once the networking namespace
          # (where cert-manager runs) is deleted.
          echo "Deleting cert-manager admission webhook configs..."
          kubectl delete validatingwebhookconfiguration networking-certs-manager-cert-manager-webhook --ignore-not-found --timeout=60s
          kubectl delete mutatingwebhookconfiguration networking-certs-manager-cert-manager-webhook --ignore-not-found --timeout=60s

          # cert-manager itself runs inside the networking namespace below.
          # Its ACME Challenge/Order CRs carry finalizer.acme.cert-manager.io,
          # which only cert-manager's own controller can clear — same trap
          # documented below for Argo CD's Application/AppProject finalizers.
          # Deleting them now, while that controller is still running, lets
          # it process the finalizer normally instead of leaving the
          # networking namespace stuck in Terminating forever.
          echo "Deleting cert-manager ACME Challenge/Order resources..."
          kubectl delete challenges.acme.cert-manager.io,orders.acme.cert-manager.io \
            --all -n networking --ignore-not-found --timeout=60s

          # cert-manager's vendored chart (helm/platform/networking/certs-manager,
          # upstream jetstack/cert-manager 1.16.2) ships a startupapicheck Helm
          # hook Job plus its own ServiceAccount/Role/RoleBinding. Argo CD
          # tags Helm-hook resources with argocd.argoproj.io/hook-finalizer so
          # it can redo "before-hook-creation" cleanup on the next sync — but
          # only Argo CD's own controller ever clears that finalizer, and the
          # argocd namespace is deleted below in the same job. If that
          # controller is already gone by the time these resources are
          # deleted, the finalizer never clears and networking hangs in
          # Terminating forever (confirmed: a real teardown run timed out
          # with exactly "argocd.argoproj.io/hook-finalizer in 3 resource
          # instances" — 1 role, 1 rolebinding, 1 serviceaccount). Strip the
          # finalizer directly instead of depending on controller lifetime —
          # jq ships preinstalled on the ubuntu-latest runner image.
          echo "Clearing stray Argo CD hook-finalizers..."
          for ns in ai-system-staging assistant-staging networking; do
            for kind in job serviceaccount role rolebinding; do
              for name in $(kubectl get "$kind" -n "$ns" -o json 2>/dev/null \
                  | jq -r '.items[] | select(.metadata.finalizers != null) | select(.metadata.finalizers[] == "argocd.argoproj.io/hook-finalizer") | .metadata.name'); do
                echo "Removing hook-finalizer from $kind/$name in $ns..."
                kubectl patch "$kind" "$name" -n "$ns" --type=merge -p '{"metadata":{"finalizers":null}}'
              done
            done
          done

          echo "Deleting namespaces..."
          for ns in argocd ai-system-staging assistant-staging networking; do
            echo "Deleting namespace $ns..."
            if ! kubectl delete namespace "$ns" --ignore-not-found --timeout=300s; then
              echo "::error::Namespace $ns did not terminate within 300s — status conditions:"
              kubectl get namespace "$ns" -o jsonpath='{.status.conditions}'
              echo
              exit 1
            fi
            echo "Namespace $ns deleted."
          done

          # Delete any remaining cluster-scoped resources that Argo CD
          # doesn't own — each --timeout blocks until it's confirmed gone.
          # GatewayClass eg is deleted here, not earlier, since its
          # gateway-exists-finalizer only clears once the networking
          # namespace's Gateway (deleted above) is gone.
          echo "Deleting cluster-scoped resources..."
          kubectl delete clusterissuer selfsigned-staging letsencrypt-staging --ignore-not-found --timeout=60s
          kubectl delete gatewayclass eg --ignore-not-found --timeout=60s
          kubectl delete clusterrole,clusterrolebinding \
            -l 'app.kubernetes.io/instance in (argocd,networking-certs-manager,networking-gateway-controller)' \
            --ignore-not-found --timeout=60s

          # The 4 static hostPath PVs (Retain policy — survive their PVC's
          # deletion above) are cluster-scoped, so the namespace loop never
          # touches them. Left behind, they'd sit "Released" with a stale
          # claimRef pointing at the just-deleted PVC's UID, and the next
          # install's fresh PVC (new UID) could never rebind to them —
          # leaving broker/database/llm/assistant pods stuck Pending until
          # someone manually clears claimRef. Deleting them here keeps
          # teardown+reinstall idempotent; this data is ephemeral per
          # staging cycle anyway.
          echo "Deleting static PersistentVolumes..."
          kubectl delete pv \
            ai-system-staging-broker-data \
            ai-system-staging-database-data \
            ai-system-staging-llm-models \
            assistant-staging-assistant-workspace \
            --ignore-not-found --timeout=60s

  install-argocd-prod:
    runs-on: ubuntu-latest

    # A push only bootstraps the cluster matching the branch that triggered
    # it. Additionally gated by the DEPLOY_PROD repo variable — the single
    # flag controlling whether any prod resource gets created at all (see
    # "Required variables" above).
    if: |
      vars.DEPLOY_PROD == 'true' &&
      github.ref_name == 'prod'

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install Cloudfleet CLI
        run: |
          curl -fsSL https://downloads.cloudfleet.ai/apt/pubkey.gpg | sudo tee /usr/share/keyrings/cloudfleet-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudfleet-archive-keyring.gpg] https://downloads.cloudfleet.ai/apt stable main" | sudo tee /etc/apt/sources.list.d/cloudfleet.list
          sudo apt-get update && sudo apt-get install -y cloudfleet

      - name: Configure kubeconfig
        run: |
          cloudfleet auth add-profile token default ${{ secrets.CF_ORG_ID }} ${{ secrets.CF_ACCESS_TOKEN }} ${{ secrets.CF_ACCESS_TOKEN_SECRET }}
          cloudfleet clusters kubeconfig ${{ secrets.CF_CLUSTER_ID_PROD }}

      - name: Add Argo Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo

      - name: Install/Upgrade Argo CD
        # Chart version pinned here — bump deliberately, re-run to upgrade.
        # Values read straight from the checked-out repo, ahead of Argo CD
        # existing to apply argocd/bootstrap/install.yaml itself.
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --version 10.1.3 \
            --namespace argocd \
            --create-namespace \
            -f argocd/clusters/prod/values/argocd.yaml \
            -f argocd/clusters/prod/values/argocd-cmp.yaml

      - name: Configure SOPS age key
        # Mirrors the manual `kubectl create secret` step README.md documents
        # for dev, so the sops-helm CMP can decrypt *.enc.yaml on this cluster.
        # Written to a temp file first since --from-file needs a real path.
        run: |
          key_file="$(mktemp)"
          printf '%s' "${{ secrets.SOPS_AGE_KEY_PROD }}" > "$key_file"
          kubectl create secret generic sops-age-key -n argocd \
            --from-file=key.txt="$key_file" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f "$key_file"

      - name: Hand self-management over to Argo CD
        # Same argocd/bootstrap/install.yaml bootstrap.sh uses for the dev
        # cluster, with ENV=DIR=prod substituted instead of dev.
        run: |
          sed -e 's/__ENV__/prod/g' -e 's/__DIR__/prod/g' argocd/bootstrap/install.yaml \
            | kubectl apply -f - -n argocd

      - name: Apply the app-of-apps
        # Same argocd/bootstrap/root.yaml bootstrap.sh uses for the dev
        # cluster, with ENV=DIR=prod substituted instead of dev.
        run: |
          sed -e 's/__ENV__/prod/g' -e 's/__DIR__/prod/g' argocd/bootstrap/root.yaml \
            | kubectl apply -f - -n argocd

  teardown-prod:
    runs-on: ubuntu-latest

    # Mirrors install-argocd-prod's trigger, but fires on the opposite
    # DEPLOY_PROD value — same flag, so the two jobs never both run.
    if: |
      vars.DEPLOY_PROD != 'true' &&
      github.ref_name == 'prod'

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Cloudfleet CLI
        run: |
          curl -fsSL https://downloads.cloudfleet.ai/apt/pubkey.gpg | sudo tee /usr/share/keyrings/cloudfleet-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudfleet-archive-keyring.gpg] https://downloads.cloudfleet.ai/apt stable main" | sudo tee /etc/apt/sources.list.d/cloudfleet.list
          sudo apt-get update && sudo apt-get install -y cloudfleet

      - name: Configure kubeconfig
        run: |
          cloudfleet auth add-profile token default ${{ secrets.CF_ORG_ID }} ${{ secrets.CF_ACCESS_TOKEN }} ${{ secrets.CF_ACCESS_TOKEN_SECRET }}
          cloudfleet clusters kubeconfig ${{ secrets.CF_CLUSTER_ID_PROD }}

      - name: Delete every prod resource
        # argocd is deleted first, ahead of the other namespaces, so this
        # doesn't depend on Argo CD's own controller staying up long enough
        # to process every Application (including PreDelete/PostDelete
        # hooks) — trading graceful hook execution for a deletion that can't
        # get stuck waiting on a controller that's being torn down in the
        # same operation.
        #
        # Namespace deletion natively cascades to everything inside it
        # (Deployments, Secrets, Argo CD's own install, its Application/
        # AppProject CRs) — no dependency on Argo CD's own cascade/finalizer
        # mechanism, which none of these Applications opt into. ClusterIssuer
        # and GatewayClass are cluster-scoped (outside any namespace), so
        # they're deleted explicitly. --ignore-not-found makes this safe to
        # rerun and safe on a cluster that was never installed.
        #
        # Namespaces are deleted one at a time with --timeout, since a
        # namespace can hang in Terminating forever if a resource inside it
        # (e.g. an Application/AppProject CR) has a finalizer that only Argo
        # CD's own controller can clear — and that controller's pod may
        # already be gone by the time this runs. On timeout, the namespace's
        # status conditions name exactly what's still blocking it.
        run: |
          # Fail immediately if any delete below times out, so a stuck
          # resource surfaces as a failed job instead of finishing silently.
          set -euo pipefail

          # cert-manager's admission webhooks gate writes to its own CRs,
          # including the finalizer removal below. If cert-manager's pod is
          # already unhealthy for any reason, these configs point at a dead
          # Service and reject the delete outright. Removing them first
          # makes the next step safe regardless of cert-manager's health —
          # they're being torn down anyway once the networking namespace
          # (where cert-manager runs) is deleted.
          echo "Deleting cert-manager admission webhook configs..."
          kubectl delete validatingwebhookconfiguration networking-certs-manager-cert-manager-webhook --ignore-not-found --timeout=60s
          kubectl delete mutatingwebhookconfiguration networking-certs-manager-cert-manager-webhook --ignore-not-found --timeout=60s

          # cert-manager itself runs inside the networking namespace below.
          # Its ACME Challenge/Order CRs carry finalizer.acme.cert-manager.io,
          # which only cert-manager's own controller can clear — same trap
          # documented below for Argo CD's Application/AppProject finalizers.
          # Deleting them now, while that controller is still running, lets
          # it process the finalizer normally instead of leaving the
          # networking namespace stuck in Terminating forever.
          echo "Deleting cert-manager ACME Challenge/Order resources..."
          kubectl delete challenges.acme.cert-manager.io,orders.acme.cert-manager.io \
            --all -n networking --ignore-not-found --timeout=60s

          # cert-manager's vendored chart (helm/platform/networking/certs-manager,
          # upstream jetstack/cert-manager 1.16.2) ships a startupapicheck Helm
          # hook Job plus its own ServiceAccount/Role/RoleBinding. Argo CD
          # tags Helm-hook resources with argocd.argoproj.io/hook-finalizer so
          # it can redo "before-hook-creation" cleanup on the next sync — but
          # only Argo CD's own controller ever clears that finalizer, and the
          # argocd namespace is deleted below in the same job. If that
          # controller is already gone by the time these resources are
          # deleted, the finalizer never clears and networking hangs in
          # Terminating forever (confirmed on staging: a real teardown run
          # timed out with exactly "argocd.argoproj.io/hook-finalizer in 3
          # resource instances" — 1 role, 1 rolebinding, 1 serviceaccount).
          # Strip the finalizer directly instead of depending on controller
          # lifetime — jq ships preinstalled on the ubuntu-latest runner image.
          echo "Clearing stray Argo CD hook-finalizers..."
          for ns in ai-system-prod networking; do
            for kind in job serviceaccount role rolebinding; do
              for name in $(kubectl get "$kind" -n "$ns" -o json 2>/dev/null \
                  | jq -r '.items[] | select(.metadata.finalizers != null) | select(.metadata.finalizers[] == "argocd.argoproj.io/hook-finalizer") | .metadata.name'); do
                echo "Removing hook-finalizer from $kind/$name in $ns..."
                kubectl patch "$kind" "$name" -n "$ns" --type=merge -p '{"metadata":{"finalizers":null}}'
              done
            done
          done

          echo "Deleting namespaces..."
          for ns in argocd ai-system-prod networking; do
            echo "Deleting namespace $ns..."
            if ! kubectl delete namespace "$ns" --ignore-not-found --timeout=300s; then
              echo "::error::Namespace $ns did not terminate within 300s — status conditions:"
              kubectl get namespace "$ns" -o jsonpath='{.status.conditions}'
              echo
              exit 1
            fi
            echo "Namespace $ns deleted."
          done

          # Delete any remaining cluster-scoped resources that Argo CD doesn't
          # own — each --timeout blocks until it's confirmed gone.
          echo "Deleting cluster-scoped resources..."
          kubectl delete clusterissuer selfsigned-prod letsencrypt-prod --ignore-not-found --timeout=60s
          kubectl delete gatewayclass eg --ignore-not-found --timeout=60s
          kubectl delete clusterrole,clusterrolebinding \
            -l 'app.kubernetes.io/instance in (argocd,networking-certs-manager,networking-gateway-controller)' \
            --ignore-not-found --timeout=60s

          # The 3 static hostPath PVs (Retain policy — survive their PVC's
          # deletion above) are cluster-scoped, so the namespace loop never
          # touches them. Left behind, they'd sit "Released" with a stale
          # claimRef pointing at the just-deleted PVC's UID, and the next
          # install's fresh PVC (new UID) could never rebind to them —
          # leaving broker/database/llm pods stuck Pending until someone
          # manually clears claimRef. Deleting the PV object doesn't touch
          # the underlying hostPath directory on the node (Retain policy
          # only governs automatic reclamation, not manual delete), and the
          # namespace deletion above already dropped the PVCs pointing at
          # that same data — so this doesn't destroy anything the teardown
          # wasn't already destroying. No assistant PV here — that app
          # isn't deployed to prod (argocd/clusters/prod/ has no
          # assistant.yaml).
          echo "Deleting static PersistentVolumes..."
          kubectl delete pv \
            ai-system-prod-broker-data \
            ai-system-prod-database-data \
            ai-system-prod-llm-models \
            --ignore-not-found --timeout=60s
