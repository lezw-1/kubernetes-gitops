name: Validate manifests

on:
  pull_request:
    branches: [dev, prod]

jobs:
  helm-lint:
    name: Helm lint & template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: helm lint apps/frontend
        run: helm lint apps/frontend

      - name: helm template against each environment's values
        run: |
          for env in dev staging prod; do
            echo "--- clusters/$env/frontend.yaml ---"
            helm template frontend apps/frontend -f clusters/"$env"/frontend.yaml
          done

  kubeconform:
    name: kubeconform schema check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - uses: yokawasa/action-setup-kube-tools@v0.11.2
        with:
          setup-tools: kubeconform
          kubeconform: v0.6.7

      - name: Render and validate frontend chart
        run: |
          for env in dev staging prod; do
            helm template frontend apps/frontend -f clusters/"$env"/frontend.yaml \
              | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      # Static Argo CD manifests use argoproj.io CRDs, not in kubeconform's default catalog
      - name: Validate static Argo CD manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            projects/app-project.yaml projects/applications/*.yaml \
            bootstrap/argocd/namespace.yaml bootstrap/argocd/install.yaml bootstrap/argocd/root-app.yaml

  yaml-lint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yamllint==1.35.1

      - run: yamllint projects clusters apps bootstrap
